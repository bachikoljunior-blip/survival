    contract:
      objective: >-
        Drive the visible on-screen movement, camera, attack, dodge, block and dialogue controls from
        real touch coordinates at 667x375, and check 44 px hit targets, overlap, mis-taps, simultaneous
        input and orientation change.
      allowed_scope:
        - tools/ (new 667x375 Playwright touch smoke)
        - >-
            src/ui/hud.js, src/ui/screens.js, src/core/input.js, public/styles.css — only if a failing hit
            target must be fixed, and only with the platform owner
        - AI_DEVELOPMENT/STATE.yaml
        - AI_DEVELOPMENT/WORK_GRAPH.yaml
        - AI_DEVELOPMENT/LEDGER.jsonl
        - AI_DEVELOPMENT/EVIDENCE/
        - docs/STATE.md (status sections only)
      prohibited_changes:
        - >-
            .github/workflows/autopilot.yml — standing user instruction, restated in docs/STATE.md sections
            5 and 9.
        - >-
            The six generated root publication files (index.html, styles.css, cinderline.1.0.0.js,
            manifest.webmanifest, icon.svg, .nojekyll). Decision OD-005: they are generated artifacts. Edit
            the source under public/ and regenerate with npm run build:pages-root.
        - >-
            Any real-device or frame-rate claim. Blocker B1: no device exists. Emulation must be stated
            explicitly.
        - Loosening the 44 px requirement in docs/bible.md to make the test pass.
        - >-
            docs/DONE.md gate wording. To change a gate, change docs/directive.md section 16 and reflect it
            into DONE.md — never the reverse (docs/DONE.md:7).
      affected_systems:
        - touch input
        - HUD layout
        - QA harness
      invariants:
        - >-
            The production input chain is exercised; synthetic events that bypass hit testing prove nothing
            about hit targets.
      required_inputs:
        - >-
            docs/bible.md IMP-09: action buttons measure 35.2 px at uiScale 0.8, violating the 44 px rule in
            section 11
        - >-
            docs/STATE.md acceptance row 12, currently partial: the map has no pan or zoom and no tutorial
            screen exists
        - The Gate B slice uses the production input chain but is not evidence about visible hit targets
      expected_outputs:
        - A 667x375 touch smoke under tools/
        - An evidence record naming the emulation environment
        - A finding record if a target fails
      assumptions:
        - >-
            uiScale is reachable from the smoke. If it is not, the smoke cannot exercise the known IMP-09
            failure and must say so rather than pass.
      risks:
        - >-
            A green result that never exercises uiScale 0.8 would repeat defect R-08: a test that does not
            execute the verb it claims to verify. Expect this test to fail first.
      verification:
        - 44 px minimum hit target at the tested uiScale values, including 0.8.
        - Overlapping targets.
        - Mis-taps near boundaries.
        - Simultaneous inputs.
        - Orientation change.
      mandatory_gates:
        - npm run validate:ops
      evidence_required:
        - Measured hit-target sizes per control and uiScale
        - Exact touch coordinates and observed responses
        - Explicit emulation statement and no device claim
      active_modules:
