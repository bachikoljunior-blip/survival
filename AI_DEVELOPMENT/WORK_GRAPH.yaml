          activation_reason: B2 is about the rendered, touchable surface and has no evidence of any kind today.
          budget: One smoke across the listed cases.
          exit_condition: Every listed case executed and recorded, whether it passes or fails.
      owner: >-
        QA owner for the smoke; platform owner for any src/ui, src/core/input.js or public/styles.css
