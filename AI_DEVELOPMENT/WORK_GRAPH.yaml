    kind: task
    parent: GATE-C
    title: Run one complete opening-to-ending route with real traversal, survival and combat
    status: ready
    priority_class: P4
    priority_rationale: P4 — Gate C work that depends on a harness whose OF-003/OF-004 repairs are still unverified.
    dependencies:
