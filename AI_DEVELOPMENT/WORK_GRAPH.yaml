    evidence: []
    reason: >-
      Legacy reason verbatim: "Only a clean-save full run may support C1, D3 or replacement of the
      unmeasured playtime estimate" (PROJECT_STATE.json:156). Legacy priority 79.
    contract:
      objective: >-
        Run one complete opening-to-ending route from a clean save using real traversal, real survival
        and real combat, with no teleport, no gas immunity and no direct damage.
      allowed_scope:
        - tools/ (full-run harness)
        - AI_DEVELOPMENT/STATE.yaml
        - AI_DEVELOPMENT/WORK_GRAPH.yaml
        - AI_DEVELOPMENT/LEDGER.jsonl
        - AI_DEVELOPMENT/EVIDENCE/
        - docs/STATE.md (status sections only)
      prohibited_changes:
        - >-
            .github/workflows/autopilot.yml — standing user instruction, restated in docs/STATE.md sections
            5 and 9.
        - >-
            The six generated root publication files (index.html, styles.css, cinderline.1.0.0.js,
            manifest.webmanifest, icon.svg, .nojekyll). Decision OD-005: they are generated artifacts. Edit
            the source under public/ and regenerate with npm run build:pages-root.
        - >-
            Any placement helper, raw position write, teleport, gasImmune assignment, direct damage() or
            kill-event emission in the traversal path. These are exactly the operations OF-005 caught being
            accepted.
        - Claiming C1 or D3 from anything less than a complete clean-save run.
        - >-
            docs/DONE.md gate wording. To change a gate, change docs/directive.md section 16 and reflect it
            into DONE.md — never the reverse (docs/DONE.md:7).
      affected_systems:
        - QA harness
        - full-route verification
      invariants:
        - Player position changes only through the movement, input and collision path.
        - player.gasImmune stays false and gas exposure is sampled throughout.
        - Hostile health changes only through a player attack action and the normal combat hit path.
      required_inputs:
        - AI_DEVELOPMENT/HANDOFFS/README.md — the five conditions a real-route claim must meet
        - AI_DEVELOPMENT/EVIDENCE/GB-IMP06-SLICE.json — the verified partial slice this extends
        - docs/bible.md IMP-06
        - OF-003 and OF-004, both still repair under verification, which affect the same harness
      expected_outputs:
        - A full-run harness
        - >-
            An evidence record reporting distance, simulated duration, exposure range, damage exchanged and
            the exact covered route
        - A measured playtime figure to replace the unmeasured 3-5 hour estimate
      assumptions:
        - The Chapter 1 slice generalises to the whole route. It may not; the slice covers one chapter.
      uncertainty: >-
        OF-003 recorded a door-transition stall whose repair is not yet verified. Two fresh isolated
        publish runs and then the complete suite are required before this task can trust the harness.
      risks:
        - >-
            A full run that quietly reintroduces any prohibited operation would restate OF-005. Every
            previously accepted invalid operation must remain an executable expected-failure fixture.
      verification:
        - A clean-save run from opening to an ending with real traversal throughout.
        - All 19 adversarial fixtures still exit nonzero.
        - Distance, duration, exposure, damage and route reported.
      mandatory_gates:
        - npm test
        - npm run validate:ops
      evidence_required:
        - The full-run report
        - Measured playtime
        - A statement of which environments it covers and which it does not
      active_modules:
        - module: 10.4 independent user-surface testing
          activation_reason: C1 and D3 are about the game actually being playable end to end.
          budget: One complete route first; branch coverage is separate work.
          exit_condition: One clean-save route completes with real verbs throughout.
      owner: QA owner
      integration_owner: Primary integrator
      independence_level: B
      rollback: "Harness-only: delete the new tools/ file and its evidence record."
      completion_conditions:
        - One clean-save opening-to-ending route completes with real movement, survival and combat.
        - >-
            OF-003 and OF-004 are verified closed first, or the run explicitly records that it ran against
            an unverified repair.
        - >-
            C1 and D3 statuses updated to what the evidence supports; one route is not the full branch
            matrix.
