  - id: GB-H1
    kind: task
    parent: GATE-B
    title: Add save migration and regression tests
    status: active
    priority_class: P0
    priority_rationale: >-
      P0 — data integrity. A version bump silently discards every existing save (src/game/state.js:292
      and :357; no migrate() exists) and the build is already publicly deployed. Silent, unrecoverable
      loss of player progress outranks everything else open.
    dependencies:
      - OPS-001
    acceptance_refs:
      - B5
      - C5
    evidence: []
    reason: >-
      docs/STATE.md action 1; audit finding H1. The legacy record said "action 2", which did not match
      docs/STATE.md — corrected during the migration.
    contract:
      objective: >-
        Add a save-migration layer to src/game/state.js so raising SAVE_VERSION migrates existing
        progress instead of silently discarding it, and prove the migration with fixtures and regression
        tests.
      allowed_scope:
        - src/game/state.js
        - tools/ (new save-migration fixtures and regression runner)
        - AI_DEVELOPMENT/STATE.yaml
        - AI_DEVELOPMENT/WORK_GRAPH.yaml
        - AI_DEVELOPMENT/LEDGER.jsonl
        - AI_DEVELOPMENT/EVIDENCE/
        - docs/STATE.md (status sections only)
      prohibited_changes:
        - >-
            .github/workflows/autopilot.yml — standing user instruction, restated in docs/STATE.md sections
            5 and 9.
        - >-
            The six generated root publication files (index.html, styles.css, cinderline.1.0.0.js,
            manifest.webmanifest, icon.svg, .nojekyll). Decision OD-005: they are generated artifacts. Edit
            the source under public/ and regenerate with npm run build:pages-root.
        - >-
            docs/DONE.md gate wording. To change a gate, change docs/directive.md section 16 and reflect it
            into DONE.md — never the reverse (docs/DONE.md:7).
        - Upward revision of the docs/bible.md section 16 scope numbers, which the bible forbids outright.
        - Using README.md as a design authority. It has documented features that do not exist.
        - >-
            Files owned by other subsystems in the docs/STATE.md ownership map (src/content/*, src/render/*,
            src/world/city.js, src/ui/*) without the owning role.
        - >-
            Recording C5 as satisfied. C5 requires the save, death, retry, reload and resume flows to work
            across the whole game; an isolated migration layer does not establish that.
      affected_systems:
        - save/load
        - progression state
        - QA harness
      invariants:
        - >-
            A save written by the current version must still load unchanged after the migration layer
            exists.
        - >-
            A migration that cannot complete must tell the player, not fail silently and not destroy the
            save.
        - main must stay runnable throughout.
      required_inputs:
        - >-
            src/game/state.js:291-292 — deserialise version gate: if (!d || d.v !== SAVE_VERSION) return
            false
        - src/game/state.js:352-357 — Storage.load version gate
        - >-
            docs/bible.md R-02 (high): no save migration exists; one version bump silently erases every
            player's progress
        - docs/reviews/audit-incumbent.md finding H1
      expected_outputs:
        - A migrate(d) layer in src/game/state.js
        - Old-version save fixtures
        - A regression runner under tools/
        - An evidence record under AI_DEVELOPMENT/EVIDENCE/ stating environment and limitations
      assumptions:
        - SAVE_VERSION is the only version discriminator in play. Verify before relying on it.
      uncertainty: >-
        No inventory exists of which shipped save shapes are in the wild. The public build has been
        deployed, so at least one shape other than the current one may exist.
      risks:
        - >-
            A migration bug is worse than no migration: it can corrupt a save that would otherwise merely
            have been rejected.
        - >-
            Fixtures written from the current shape only would reproduce defect R-08 — a test that does not
            execute the verb it claims to verify.
      verification:
        - Load an old-version fixture and assert the migrated state matches the expected current shape.
        - Multi-step migration across at least two version boundaries.
        - >-
            Explicit failure path: a corrupt or unmigratable save surfaces a notice and leaves the stored
            data intact.
        - Current-version save/load regression.
        - User-surface check that the recovery notice is actually visible.
        - npm run validate:ops exits 0.
      mandatory_gates:
        - npm run validate:ops
        - npm run validate
        - node tools/check_reviews.mjs --gate B
      evidence_required:
        - Fixture inputs and migrated outputs
        - Exact commands and environment
        - Before-and-after behavior for the failure path
        - A statement of what the evidence does not cover
      active_modules:
        - module: 10.1 minimal infrastructure bootstrap
          activation_reason: No save fixtures or save regression runner exist, and C5 cannot be verified without them.
          budget: Fixtures and one runner. Stop when the five verification items can be executed repeatably.
          exit_condition: The runner executes all five checks and fails loudly when the migration is broken.
        - module: 10.5 checkpoint and state-injection verification
          activation_reason: >-
            Old-version saves are not reachable by normal play from the current build; they must be injected
            as fixtures.
          budget: One fixture per supported prior version.
          exit_condition: >-
            Injection is paired with a normal-flow save/load run so injection cannot hide broken
            initialization.
      owner: >-
        Gameplay owner (docs/STATE.md assigns src/game/state.js to the combat/progression/AI/physics
        role).
      specialists:
        - >-
            QA owner for tools/ — this task crosses two owners and needs the change report docs/STATE.md
            requires.
      integration_owner: Primary integrator
      independence_level: B
      rollback: >-
        Revert only the src/game/state.js and tools/ changes (git revert, or git checkout
        193f408df049f068be57de7a1944089942720ad9 -- src/game/state.js), then re-run npm run
        validate:ops. Do not reset to cc96f3a: that predates the current records and would discard
        OD-005, OF-006 and the publication evidence.
      completion_conditions:
        - migrate(d) exists and is reached by both the deserialise and Storage.load paths.
        - All five pending_verification items are executed and recorded with evidence.
        - The isolated layer is verified before integration, in that order.
        - audit-incumbent.md H1 is resolved, so node tools/check_reviews.mjs --gate B stops reporting it.
        - npm run validate:ops exits 0.
  - id: GB-H2
    kind: task
    parent: GATE-B
    title: Recover from runtime errors and rejected promises
    status: ready
    priority_class: P1
    priority_rationale: >-
      P1 — recoverability and failure visibility. Post-boot errors and rejected promises are uncaught,
      so the player sees a silent freeze. Ranked below GB-H1 because it hides failures rather than
      destroying stored data.
    dependencies:
      - OPS-001
    acceptance_refs:
      - B5
      - D6
    evidence: []
    reason: docs/STATE.md action 2; audit finding H2.
    contract:
      objective: >-
        Keep window.onerror and unhandledrejection connected to the existing recovery panel after
        startup completes, so a post-boot failure shows the player something instead of a silent freeze.
      allowed_scope:
        - public/index.html (the boot-note and recovery-panel block)
        - src/main.js
        - tools/ (new Playwright error-recovery smoke)
        - AI_DEVELOPMENT/STATE.yaml
        - AI_DEVELOPMENT/WORK_GRAPH.yaml
        - AI_DEVELOPMENT/LEDGER.jsonl
        - AI_DEVELOPMENT/EVIDENCE/
        - docs/STATE.md (status sections only)
      prohibited_changes:
        - >-
            .github/workflows/autopilot.yml — standing user instruction, restated in docs/STATE.md sections
            5 and 9.
        - >-
            The six generated root publication files (index.html, styles.css, cinderline.1.0.0.js,
            manifest.webmanifest, icon.svg, .nojekyll). Decision OD-005: they are generated artifacts. Edit
            the source under public/ and regenerate with npm run build:pages-root.
        - The <noscript> block in public/index.html, which records a deliberate decision not to change it.
        - >-
            docs/DONE.md gate wording. To change a gate, change docs/directive.md section 16 and reflect it
            into DONE.md — never the reverse (docs/DONE.md:7).
        - Using README.md as a design authority. It has documented features that do not exist.
        - >-
            Claiming D6 as automatically verified. D6 routes through tools/check_console.mjs, which
            docs/DONE.md marks not implemented and which does not exist.
      affected_systems:
        - boot sequence
        - error recovery UI
      invariants:
        - Normal startup must still reach the game.
        - >-
            The recovery panel is the only surface a player sees when startup fails; it must be
            re-smoke-tested after any change or revert.
      required_inputs:
        - >-
            public/index.html:91-93 — window.__cinderlineBooted guard; the error listener early-returns once
            it is true
        - src/main.js:31 — sets __cinderlineBooted true at the start of main()
        - >-
            docs/bible.md R-03 (high): nobody catches post-startup uncaught errors or rejected promises; the
            player sees a silent freeze
        - docs/reviews/audit-incumbent.md finding H2
      expected_outputs:
        - Post-boot error and rejection handling wired to the recovery panel
        - A Playwright error-recovery smoke under tools/
        - An evidence record with before-and-after user-surface behavior
      assumptions:
        - The existing recovery panel is reusable after boot without layout changes. Verify by driving it.
      risks:
        - >-
            A handler that swallows errors instead of surfacing them would be worse than the current state,
            because it would also hide them from the console scan D6 will eventually run.
        - >-
            src/main.js is not assigned an owner in the docs/STATE.md ownership map; edit it only after the
            platform owner claims it.
      verification:
        - Normal startup still reaches the game.
        - A synchronous exception thrown after boot surfaces the recovery UI.
        - A rejected promise after boot surfaces the recovery UI.
        - Retry works from the recovery UI.
        - All four driven from the user-visible surface, not from internal state.
      mandatory_gates:
        - npm run validate:ops
        - node tools/check_reviews.mjs --gate B
      evidence_required:
        - Exact actions and observed surface behavior for each of the four cases
        - Environment, stated as emulation
        - Before-and-after evidence
      active_modules:
        - module: 10.4 independent user-surface testing
          activation_reason: >-
            The requirement is about what the player sees when something breaks, which cannot be established
            by reading source.
          budget: One smoke covering the four cases.
          exit_condition: All four cases driven through the real surface with recorded evidence.
      owner: >-
        Platform owner (docs/STATE.md assigns public/index.html, src/core/*, src/ui/*, src/audio/*,
        public/styles.css).
      integration_owner: Primary integrator
      independence_level: B
      rollback: >-
        Revert the public/index.html and src/main.js hunks only, then re-smoke-test the boot-failure
        path before considering the rollback complete.
      completion_conditions:
        - Post-boot errors and rejections reach the recovery panel.
        - All four cases verified from the user surface with evidence.
        - audit-incumbent.md H2 is resolved, so node tools/check_reviews.mjs --gate B stops reporting it.
        - >-
            D6 is not claimed: it additionally needs a production-build console scan that does not exist
            yet.
