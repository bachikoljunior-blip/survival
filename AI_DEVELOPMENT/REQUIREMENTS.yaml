  - id: REQ-ENG-08
    statement: >-
      Modular separation of responsibilities across app lifecycle / renderer and scene / world
      streaming / entity state / input abstraction / camera / movement and physics / combat and
      interaction / AI and navigation / quest and narrative state / progression / UI / audio / save
      and migration / asset loading / performance measurement / debug and test. The production build
      must not be crammed into one file. Avoid hidden global coupling, duplicated state,
      framerate-dependent logic, unmanaged listeners, per-frame allocation and unbounded object
      creation. Use a fixed or bounded simulation step; pool frequently created objects; dispose
      geometry, materials, render targets, textures, audio nodes and listeners when no longer needed.
    scope: engineering
    source: docs/directive.md:194-196; docs/bible.md:422-436
    epistemic_status: user_requirement
    status: partially_satisfied
    constraints:
      - >-
          Fixed 60Hz step with accumulator, max 4 substeps, backlog discard, render interpolation alpha
          (docs/bible.md:436)
    criteria_refs:
      - B6
    notes: >-
      docs/STATE.md:175 row 4 records the fixed-step / framerate-independent property as 検証済 by audit
      plus individual confirmation (`src/core/engine.js:13,318,327-333`). Corpse cleanup is unresolved
      (R-09, medium, docs/bible.md:504).
  - id: REQ-PERF-01
    statement: >-
      Design against the iPhone SE 3rd generation from the first playable build. Targets: stable 30
      FPS or better in representative combat and traversal; 60 FPS if conditions allow; consistent
      frame pacing with no long stalls; bounded memory across repeated area transitions; chunked
      loading rather than loading the whole world at startup.
    scope: performance
    source: docs/directive.md:204-206
    epistemic_status: user_requirement
    status: blocked
    constraints:
      - 30 FPS is a design target, not a measurement (docs/STATE.md:110, docs/bible.md:496)
    criteria_refs:
      - B4
      - D8
    notes: >-
      Blocked by REQ-BLOCKER-01. docs/STATE.md:185 row 14: 「実機で 30 FPS を満たす」 is 原理的に未検証 and 主張してはならない.
      Chunk streaming is one of the three §13 items recorded as unimplemented (R-04, high,
      docs/bible.md:499).
  - id: REQ-PERF-02
    statement: >-
      Initial performance budgets (revisable on evidence, revisions must be recorded): draw calls ≤150
      typical / ≤250 worst; visible triangles ≤300,000 typical; texture memory ≤200MB with max side
      2048; on-screen skinned meshes ≤8 and realtime shadow casters ≤2; initial payload ≤15MB and
      interactive within 8s on 4G; JS frame time ≤8ms.
    scope: performance
    source: docs/directive.md:210-214
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - B4
      - D8
    notes: >-
      NOT MET as recorded: docs/STATE.md:184 row 13 「§13 の描画予算を満たす」 = 未達 (draw calls exceed at medium
      tier; shadow-caster count unmet; 監査 §13 表). R-05 high, 未対策 (docs/bible.md:500). JS frame time
      ≤8ms has NEVER been measured — R-17 high, 未解決 (docs/bible.md:512), because perf.mjs measures
      only fixedUpdate and excludes render(), scene-graph traversal, culling, animation evaluation and
      post effects. The initial-payload number was deleted from the bible because its only source was
      README.md and shots/ is .gitignored (docs/STATE.md:203, docs/bible.md:29 R-19).
  - id: REQ-PERF-03
    statement: >-
      Implement quality tiers and automatic degradation: DPR cap, dynamic render scale, LOD, culling,
      instancing, shadow limits, distance-based animation decimation, AI update staggering, effect
      density reduction.
    scope: performance
    source: docs/directive.md:216
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - B4
    notes: >-
      Three explicitly required items are unimplemented — チャンクストリーミング / AI更新のずらし / 距離によるアニメーション間引き —
