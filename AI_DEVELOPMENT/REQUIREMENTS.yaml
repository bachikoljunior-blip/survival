      - .nojekyll present
    notes: >-
      docs/STATE.md:174 records this as verified: `npm run build`, `build.mjs:36-63`,
      `public/.nojekyll`. docs/bible.md:35 argues the esbuild build already satisfies the substantive
      requirement.
  - id: REQ-PLATFORM-04
    statement: >-
      Input is touch-first; keyboard/mouse are retained only for development.
      「最初からタッチで設計する。デスクトップ版を作ってから仮想ボタンを重ねる進め方をしない。」
    scope: platform
    source: docs/directive.md:43,182
    epistemic_status: user_requirement
    status: active
    constraints:
      - No desktop-first then overlay-virtual-buttons approach
    criteria_refs:
      - B2
      - D7
  - id: REQ-PLATFORM-05
    statement: >-
      「開発者は iPhone しか持っていない。」 The developer has only an iPhone — no PC and no local development
      environment. All work must be completed inside the repository, and no procedure that presupposes
      human manual steps may be built into the design.
    scope: platform/process
    source: docs/directive.md:17
    epistemic_status: user_requirement
    status: active
    constraints:
      - No design that depends on human manual execution
    criteria_refs:
      - B4
      - D8
    notes: >-
      This constraint is in direct tension with the only remedy available for the device blocker
      (docs/STATE.md:110 states 人間のみ can run docs/device-test-checklist.md on real hardware).
  - id: REQ-LOCAL-01
    statement: >-
      The game must build reproducibly from a clean checkout, use relative paths, contain no secrets
      and no required private services, show useful load progress, tolerate non-essential asset
      failure, present a recoverable error rather than a white screen on startup failure, version and
      migrate saves, autosave at safe points, recover from reload and interruption, stop simulation
      when hidden, and ship with no uncaught errors, rejected promises, missing assets or console spam
      in production.
    scope: engineering
    source: docs/directive.md:198
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - C5
      - D6
    notes: >-
      Save migration does not exist (docs/bible.md:497 R-02, severity high, 監査 H1 未解決;
      docs/STATE.md:94). Post-startup uncaught errors and rejected promises are not captured
      (docs/bible.md:498 R-03, high, 監査 H2 未解決; docs/STATE.md:96).
  - id: REQ-LOCAL-02
    statement: >-
      The build makes zero network requests at runtime, and ships zero external asset files (no image,
      audio, model or font files); textures, sound and models are generated at runtime.
    scope: platform
    source: docs/STATE.md:127,179; docs/bible.md:29
    epistemic_status: accepted_decision
    status: satisfied
    constraints:
      - No fetch / XHR
      - No asset files in the repository
    criteria_refs:
      - D9
    notes: >-
      IMPORTANT PROVENANCE: this is NOT a directive requirement. docs/directive.md:165 explicitly says
      「第三者アセットの使用は許可され、想定されている」 (third-party asset use is permitted and expected).
      Zero-external-assets is an inherited property of the incumbent implementation that
      docs/bible.md:29 decided to keep because 「§9 の性能要件と §3 のライセンス要件を同時に解いている」. Verified as
      docs/STATE.md:179 row 8: audit grep for fetch/XHR returned 0 hits. Runtime dependency is
      three@0.180.0 only (docs/STATE.md:125). docs/bible.md:378: 「全ての音は WebAudio で合成される。音声ファイルは1つも無い。」
      Note docs/bible.md:29 also records that the initial-payload figure is 未計測 because its only
      source was README.md.
  - id: REQ-ENG-01
    statement: >-
      Renderer is Three.js, with the version pinned to one and not changed arbitrarily
      (バージョンを1つに固定し、勝手に変えない).
    scope: engineering
    source: docs/directive.md:10
    epistemic_status: user_requirement
    status: satisfied
    constraints:
