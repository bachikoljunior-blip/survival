    criteria_refs:
      - B2
      - B4
      - D7
      - D8
    notes: >-
      No such physical device exists in the execution environment (docs/directive.md:220,
      docs/STATE.md:110). See REQ-BLOCKER-01.
  - id: REQ-PLATFORM-03
    statement: >-
      Deployment is a static build to GitHub Pages; the build must use relative paths (base: './'
      equivalent) and ship a .nojekyll file for GitHub Pages subdirectory support.
    scope: platform
    source: docs/directive.md:11,42
    epistemic_status: user_requirement
    status: satisfied
    constraints:
