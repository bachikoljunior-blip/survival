  - id: REQ-HONESTY-01
    statement: >-
      Verification honesty (mandatory). No iPhone SE exists in this project's execution environment.
      Therefore: every number must be accompanied by the exact environment in which it was measured;
      emulation results must be labelled as emulation; 「実機での結果を主張してはならない。示唆してもならない」 — real-device
      results must not be claimed, nor even implied; and docs/device-test-checklist.md must exist as a
      human-executable, pass/fail procedure.
    scope: honesty
    source: docs/directive.md:224-226; docs/DONE.md:38,73; docs/STATE.md:110
    epistemic_status: user_requirement
    status: active
    constraints:
      - No physical-device performance claim of any kind until a human executes the checklist
    criteria_refs:
      - B4
      - D8
    notes: >-
      docs/STATE.md:181 row 10 records 「性能記述に実機主張が混入していない」 as 検証済 by code review
      (`tools/perf.mjs:2-20,184-187` states SwiftShader explicitly and refuses fps output) plus the
      audit — but the automated enforcement tool tools/check_honesty.mjs is 未実装 (docs/DONE.md:112).
  - id: REQ-HONESTY-02
    statement: >-
      Do not fabricate assets, tests, measurements, screenshots, comparisons or completion claims. Do
      not claim to have performed a comparison that was not performed. Do not fabricate test results,
      user reactions, device measurements, screenshots or critic approval.
    scope: honesty
    source: docs/directive.md:263,332; docs/STATE.md:213
    epistemic_status: user_requirement
    status: active
    criteria_refs:
      - D11
    notes: >-
      docs/DONE.md:89 escalates: writing ALL_DONE without the four conditions is treated as a
      violation of this §15 anti-fabrication rule.
  - id: REQ-HONESTY-03
    statement: >-
      A critique that says only 「良い」 or 「問題なさそう」 is invalid and cannot ground a gate pass. Critiques
