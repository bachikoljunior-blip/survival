    scope: honesty/process
    source: docs/directive.md:259; docs/DONE.md:35
    epistemic_status: user_requirement
    status: active
    criteria_refs:
      - B1
      - B3
      - B6
      - D10
  - id: REQ-HONESTY-04
    statement: >-
      Critic independence: 「機能を作ったエージェントが、その機能を承認する唯一のエージェントであってはならない。」 Critic agents may take as
