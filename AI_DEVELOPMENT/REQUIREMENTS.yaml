      This finding is what caused the concept scorecard's mobile-feasibility axis to be lowered 5→4
      and the total 31→30 (docs/STATE.md:194).
  - id: REQ-PERF-04
    statement: >-
      Implement an in-game performance HUD and a headless measurement path, and measure six scenarios
      under Playwright CPU/GPU throttling: quiet traversal / high-density environment / combat /
      effect overload / UI overlay / area transition.
    scope: performance
    source: docs/directive.md:222-223; docs/bible.md:39
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - B4
      - D8
    notes: >-
      tools/perf.mjs measures device-independent cost only. docs/DONE.md:105: 「スロットリング付きシナリオ計測と
      `render()` を含むフレーム時間計測は未実装」. docs/bible.md:39 records the six-scenario coverage as absent
      (改修対象). R-10 (medium) additionally warns the instruments themselves were found broken and only
