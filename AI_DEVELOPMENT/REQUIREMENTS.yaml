# Requirements and acceptance criteria: stable identifiers, epistemic status, verification method
# and traceability.
#
# Schema: AI_DEVELOPMENT/SCHEMAS/requirements.v1.schema.json
#
# This file does NOT own the authored text. The Gate A-D wording belongs to docs/DONE.md, which
# transcribes docs/directive.md section 16 verbatim; product requirements belong to
# docs/directive.md and docs/bible.md. Restating or softening their text here would create the
# second source of truth this record exists to prevent.
#
# Traceability is two-way: every criterion lists the work nodes that cover it, every work node
# lists the criteria it claims, and npm run validate:ops fails if either direction goes missing.
#
# Statuses are what the evidence supports, not what would be convenient. In particular C2 and D11
# are 'refuted' — affirmatively failing right now, not merely unverified — and acceptance row 6 in
# docs/STATE.md is likewise refuted.
schema_version: 1
state_revision: 2026-08-01.2
notes: >-
  Extracted from docs/directive.md, docs/bible.md, docs/DONE.md and docs/STATE.md during the
  2026-08-01 migration. Two framing corrections worth keeping visible: esbuild-instead-of-Vite is
  an accepted deviation from a still-standing directive requirement, not a requirement itself; and
  zero-external-assets is an inherited property of the implementation, not a directive line —
  docs/directive.md explicitly permits third-party assets subject to licence recording.
authorities:
  product_requirements: docs/directive.md
  approved_design_and_defects: docs/bible.md
  gate_wording: docs/DONE.md
  human_verified_position: docs/STATE.md
  review_findings: docs/reviews
  asset_ledger: docs/assets.md
  device_test_procedure: docs/device-test-checklist.md
requirements:
  - id: REQ-BRIEF-01
    statement: >-
      Fixed brief, declared 変更不可 (unchangeable): genre = third-person open-world action RPG with
      survival tension; setting = a ruined, isolated, partially collapsed modern city after a credible
      disaster; tone = grounded, mature, tense, human, serious but not relentlessly grim; art
      direction = realistic-leaning (pixel art / cartoon / parody forbidden), subject to the §9
      realistic constraints; story = fully original with strong characters, dramatic tension,
      meaningful choices, setup and payoff. Everything not on this list must be discovered, designed,
      verified and justified during production.
    scope: product
    source: docs/directive.md:31-43
    epistemic_status: user_requirement
    status: active
    constraints:
      - Everything outside the fixed brief must be justified, not assumed
      - Art direction realistic-leaning but bounded by docs/directive.md:157-166
    criteria_refs:
      - A1
      - A2
      - A3
      - A5
    notes: docs/directive.md:33 「以下は変更不可。それ以外は全て制作過程で発見・設計・検証・正当化すること。」
  - id: REQ-PLATFORM-01
    statement: Platform is the mobile web browser (iOS Safari / Android Chrome).
    scope: platform
    source: docs/directive.md:40
    epistemic_status: user_requirement
    status: active
    criteria_refs:
      - B2
      - D7
  - id: REQ-PLATFORM-02
    statement: >-
      Reference device is the iPhone SE 3rd generation, landscape orientation (基準端末: iPhone SE
      第3世代、横向き).
    scope: platform
    source: docs/directive.md:41
    epistemic_status: user_requirement
    status: active
    constraints:
