      records the area count correction 15→14 after actually executing world_data.js to confirm
      regions.length === 8: 「数える作業も計測であり、grep の目視は計測ではない」.
  - id: REQ-SCOPE-02
    statement: >-
      Estimated playtime is recorded as 3-5 hours (first playthrough). This is explicitly 「未計測の見積もり」 —
      an UNMEASURED ESTIMATE. Independent critique flagged it as concretely suspected of being
      inflated (gate-a-scope.md S-05). It must be actually measured by Gate C; if it falls short, the
      resolution is to LOWER the time claim, not to add content.
    scope: product
    source: docs/bible.md:455,460
    epistemic_status: assumption
    status: active
    constraints:
      - Do not add content to justify the number
    criteria_refs:
      - A6
      - C2
    notes: >-
      docs/bible.md:460 gives the critique's arithmetic: no voice acting so players read
      (read-aloud-equivalent 40 min is really 20-35 min); world is 298m×232m and at speedRun 4.3 m/s
      the farthest span is ~90 seconds; the whole game has 6 enemies and 2 encounters.
      「3〜5時間を成立させるには非対話部分に2.3〜4.3時間が必要だが、それを支える密度がコンテンツ側に無い。」 docs/STATE.md:186 row 15 = 未計測の見積もり.
  - id: REQ-SCOPE-03
    statement: >-
      Upward revision of scope is forbidden. 「起点を活かすことでスコープを広げない。」 Any proposal to increase the
      scope-fixed numbers is treated as running the §4 cut order backwards and is rejected by default.
      Cut order (cut from the top first): additional endings → additional districts → systemic
      features (weather / crafting / base) → enemy archetype count → quest count → effect density.
      Never cut: the completable opening-to-ending path, save/load integrity, touch operability, frame
      stability.
    scope: product
    source: docs/bible.md:486,44; docs/directive.md:27,79
    epistemic_status: user_requirement
    status: active
    criteria_refs:
      - C2
  - id: REQ-SCOPE-04
    statement: >-
      The decision on the scope numbers is 削らない (do not cut), but the ONLY admissible ground for that
      decision is that the content already exists and is not new production to be done. The original
      ground — 'reachability is verified by the 5-route playthrough' — was retracted as contrary to
      fact. Reachability verification may not be used as grounds until IMP-06 produces a
      real-traversal playthrough.
    scope: product
    source: docs/bible.md:470-484; docs/STATE.md:199-200
    epistemic_status: accepted_decision
    status: active
    criteria_refs:
      - C1
      - C2
      - C3
    notes: >-
      docs/bible.md:474-478 tabulates the harness bypasses: movement teleports via
      `tools/driver.js:41-52` `goTo` → `p.placeAt(...)`; breathing bypassed by `tools/driver.js:207`
      `G.player.gasImmune = true` (source comment: 'the harness is testing story reach, not
      survival'); combat bypassed by `tools/driver.js:168-181` `clearHostiles` calling `e.damage({
      amount: 9999 })` and `G.emit('kill', ...)` directly. 「本作の中心的柱『空気が地形である』が、自動検証の対象に一度もなっていない。」
      docs/STATE.md:200 additionally retracts the assertion that no content addition remains —
      BREAKER/DOG encounter design is by definition new content production without which C2 cannot
      pass.
  - id: REQ-PROD-01
    statement: >-
      Non-predetermination rule. Do not auto-adopt: 5-act structure / 3 factions / 4 companions / 6
      districts / missing-family stories / corporate conspiracy / biohazard. At least 3 substantially
      different directions must be built and compared on a written scorecard across 7 axes:
      originality, thematic depth, gameplay potential, emotional stakes, mobile feasibility,
      completable scope, capacity to produce meaningful consequences. Counts of characters, chapters,
      regions, quests, systems, branches and endings are derived from the depth each element can
      receive. 「少数の優れた要素を、多数の浅い要素より優先すること。これがこのドキュメントで最も重要な設計指示である。」
    scope: product
    source: docs/directive.md:49-55
    epistemic_status: user_requirement
    status: satisfied
    constraints:
      - Applies to existing assets too (docs/directive.md:23)
    criteria_refs:
      - A1
      - A2
    notes: >-
      docs/STATE.md:36 records 3 mutually-invisible independent agents plus the incumbent
      implementation compared on 7 axes in docs/reviews/gate-a-concepts.md. docs/bible.md:15 records
      the incumbent won at 31/35 on mobile feasibility and completable scope specifically because it
      is measured rather than predicted, and lost the originality axis 3/5 to concept C (5/5) —
      「この敗北を隠さない。」
  - id: REQ-PROD-02
    statement: >-
      Do not ask the user routine creative decisions. Ask only about truly blocking judgments that
      cannot be resolved by evidence, tests or comparison.
    scope: process
    source: docs/directive.md:57
    epistemic_status: user_requirement
    status: active
    notes: >-
      docs/directive.md:347 further authorizes continuing implementation, testing, critique and
      revision without routine approval within a user-started active session, and forbids fabricating
      session start/end.
  - id: REQ-PROD-03
    statement: >-
      Scope management: build a small, dense, complete world rather than a broad empty one. Every
      reachable area must carry at least one meaningful function (story, combat, traversal, discovery,
      resource acquisition, characterization, worldbuilding, puzzle, tactical positioning, shortcut,
      visible consequence). Eliminate repetitive padding, copy-paste rooms, meaningless travel time,
      generic fetch quests, meaningless collectibles, checklist design, and features included only
      because another work has them. 「機能一覧を保つためだけに弱い実装を残さない。」
    scope: product
    source: docs/directive.md:71-77
    epistemic_status: user_requirement
    status: active
    criteria_refs:
      - C2
    notes: >-
      docs/bible.md:108 and docs/STATE.md:197 apply this same principle in reverse to originality
      claims: the uniqueness claim was reduced 4 points → 2 points rather than padded.
  - id: REQ-PROD-04
    statement: >-
      The narrative must be implemented in a playable build — a detailed narrative document does not
      satisfy the requirement. `docs/narrative-state.md` must be maintained in machine-readable or
      clearly tabular form covering flags, preconditions, exclusive states, quest transitions,
      character states, consequences and endings, along with a setup-and-payoff ledger, and all routes
      must be automatically swept for contradictions, unreachable content, dangling references and
      softlocks.
    scope: product
    source: docs/directive.md:104,121; docs/bible.md:539
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - C3
      - D5
    notes: >-
      NOT MET: `docs/narrative-state.md` and the setup/payoff ledger DO NOT EXIST — IMP-14, gate C,
      source N-06 (docs/bible.md:539). The automated sweep itself exists: docs/STATE.md:172 row 1
      records `npm run validate` → VALIDATION OK as 検証済 for no dangling references / unreachable
      branches / dead consequences.
  - id: REQ-PROD-05
    statement: >-
      Avoid a simple good/evil binary, unpredictable outcomes that exist only to surprise, and a final
      menu choice that overwrites everything preceding it. Endings must be earned through accumulated
      decisions and actions.
    scope: product
    source: docs/directive.md:119; docs/bible.md:300-308
    epistemic_status: user_requirement
    status: active
    criteria_refs:
      - C1
      - C3
    notes: >-
      CURRENTLY VIOLATED and recorded as such. docs/bible.md:302: all five ENDINGS conditions are `{
      chose: ['final', X] }` only (`src/content/story.js:2260,2341,2409,2461,2513`), resolved at
      `src/game/director.js:1450`; the ending is fixed by a single tap on the final `choose` node
      (`:2170-2192`). Only 2 of 5 are gated by accumulated state; `record` / `deal` / `leave` are
      unconditional. Accumulation changes epilogue TEXT but not WHICH ending. Raised as IMP-01, gate C
      (docs/bible.md:526). docs/bible.md:308 explicitly forbids the defense that accumulation changing
      prose makes the ending 'effectively earned'.
  - id: REQ-PROD-06
    statement: >-
      Weather, time of day, survival meters, crafting, base development, reputation, schedules,
      vehicles and procedural events are OPTIONAL, not mandatory. Guns, melee weapons, stealth,
      crafting, rarity, skill trees, companions, cover and base building must not be added merely
      because they are genre conventions. The project's accepted anti-pillar declines weather /
      crafting / base development / reputation / vehicles outright, and declines skill trees / rarity
      / levels (no numeric inflation) and collectibles.
    scope: product
    source: docs/directive.md:137,145; docs/bible.md:68
    epistemic_status: accepted_decision
    status: satisfied
    constraints:
      - Anything adopted must interact meaningfully with the core loop and pass the same quality gates
    notes: >-
      docs/bible.md:62-70 anti-pillars. Progression is 7 capabilities each unlocked by a specific
      diegetic event (docs/bible.md:260-270), satisfying §8's 'strategy-changing, not
      number-inflating' progression — docs/STATE.md:178 row 7 = 検証済 (`src/game/state.js:25-61`).
  - id: REQ-PROD-07
    statement: >-
      Creative pillar 5: 「ゲームはプレイヤーの答案を採点しない。」 The game does not grade the player's answers; trust is
      not a morality meter. The main pillar is that gas simultaneously governs THREE things — player
      survival, enemy survival (4 of 5 archetypes breathe), and visibility.
    scope: product
    source: docs/bible.md:56-60,110-112
    epistemic_status: accepted_decision
    status: active
    constraints:
      - >-
          Pillar is maintained even though the implementation does not meet it — do not lower the pillar
          to hide the gap
    criteria_refs:
      - B1
    notes: >-
      REFUTED AS AN IMPLEMENTED PROPERTY. docs/STATE.md:177 row 6: the claim 「信頼値が UI に出ない」 is 反証された —
      trust is permanently displayed as a 5-step word (`src/ui/screens.js:473-487`) and 38 of 47 trust
      changes are coloured toasts. docs/STATE.md:177 also records the process failure: 「主統合者が『QUIET
      が存在する』ことだけを確認して検証済みとしたのが誤り」. docs/bible.md:58 adds that `src/content/story.js:44-50` names the
      exact string that must never be shown, and `:479-480` fires that very string without QUIET, with
      4 more at `:426, :890, :1491, :2062`, and it is translation-registered so it ships. Raised as
      IMP-02, gate B. docs/STATE.md:197 records that this refutation is why the originality claim
      dropped from 4 points to 2. The main pillar was likewise reduced from 'gas governs 4 things' to
      3 because AI pathing does not follow gas (docs/STATE.md:198, IMP-05/R-21).
  - id: REQ-MOBILE-01
    statement: >-
      Control requirements: movement and camera without gesture conflict; primary actions within reach
      on an iPhone SE 3; nothing important placed under the thumb; suppression of page scroll, text
      selection, pull-to-refresh and unintended browser gestures during play; safe-area handling;
      readable at 667×375 CSS px landscape; touch targets at least 44 CSS px; correct handling of
      simultaneous touches; safe recovery from focus loss, app switching, rotation and audio
      interruption; sensitivity and camera-invert settings.
    scope: platform/UX
    source: docs/directive.md:184
    epistemic_status: user_requirement
    status: partially_satisfied
    constraints:
      - 44 CSS px minimum touch target
      - 667×375 landscape readable
    criteria_refs:
      - B2
      - D7
    notes: >-
      44px is VIOLATED at uiScale 0.8, where action buttons measure 35.2px — IMP-09, gate B, from S-09
      / 監査 L2 (docs/bible.md:534). docs/STATE.md:100 records that the existing Gate B representative
      slice goes through the production input chain but is NOT evidence about the visible hit targets
      themselves; GB-TOUCH-SMOKE is the task that would produce that.
  - id: REQ-MOBILE-02
    statement: >-
      Every screen — menu, dialogue, inventory, map, journal, settings, death, pause, tutorial, ending
      — must be fully operable by touch.
    scope: platform/UX
    source: docs/directive.md:188
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - B2
      - D7
    notes: >-
      PARTIAL, not verified. docs/STATE.md:183 row 12: 「667×375 で全画面がタッチ操作可能」 = 部分的 (監査 M8) — the
      audit confirmed most of it, but the map has no pan/zoom and a tutorial screen does not exist.
      docs/bible.md:417-418 confirms both: チュートリアル画面 存在しない; マップのパン／ズーム 表示のみ
      (`src/ui/screens.js:595-717`).
  - id: REQ-MOBILE-03
    statement: >-
      Accessibility: UI text scaling / subtitles / individual volume sliders / high contrast for
      critical information / non-colour-dependent state representation / screen-shake and motion
      reduction / hold-vs-toggle choice / haptic feedback toggle.
    scope: platform/UX
    source: docs/directive.md:186; docs/bible.md:405-418
    epistemic_status: user_requirement
    status: partially_satisfied
    constraints:
      - >-
          Implemented and unimplemented items must not be listed in the same column (docs/bible.md:405,
          gate-a-scope.md S-10)
    criteria_refs:
      - B2
    notes: >-
      Implemented per `src/game/state.js:385-408` and `src/ui/screens.js:807-834`: language, quality,
      3 volumes, camera sensitivity, Y invert, left-handed layout, auto-sprint, UI text scaling
      0.8-1.5x, subtitles, screen shake, damage numbers, high-contrast HUD, motion reduction, haptics,
