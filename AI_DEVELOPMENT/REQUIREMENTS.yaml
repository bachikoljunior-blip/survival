      output, .nojekyll, reproducible build) and that migrating to Vite would only re-satisfy
      already-satisfied requirements.
    scope: engineering
    source: docs/directive.md:11; docs/bible.md:35; docs/STATE.md:135; docs/bible.md:510
    epistemic_status: accepted_decision
    status: satisfied
    constraints:
