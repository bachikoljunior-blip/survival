      choice (guard is hard-coded to `down()` at `src/game/game.js:492`; 監査 M7 / R-12); lock-on assist
      (exists neither in settings nor implementation — the section originally listed it as present,
      which was wrong, S-10); non-colour-dependent state representation is only partial
      (`.air.warn`/`.air.crit` are border colour + blink only, and the blink is removed by motion
      reduction, `public/styles.css:304-307, 978`; the stamina bar has no numeric label); tutorial
      screen; map pan/zoom.
  - id: REQ-AUDIO-01
    statement: >-
      Audio must provide clear action feedback, location-specific ambience, useful positional audio,
      footsteps and surface response, fair threat and detection cues, dialogue presentation, music or
      adaptive layers that improve pacing, consistent mixing and volume hierarchy, independent volume
      sliders, subtitles for critical information, and mobile-browser audio unlock after a user
      gesture. All audio must be original or commercially licensed and recorded as such; temporary
      sounds must be removed before release.
    scope: product/platform
    source: docs/directive.md:174,176; docs/bible.md:378-385
    epistemic_status: user_requirement
    status: partially_satisfied
    constraints:
      - All sound is synthesized in WebAudio; zero audio files (docs/bible.md:378)
    criteria_refs:
      - B1
      - C4
    notes: >-
      docs/bible.md:385 records the mobile audio unlock as being performed after user interaction. No
      independent verification record for the audio criteria is cited in docs/STATE.md §7.
  - id: REQ-OPS-01
    statement: >-
      Multiple agents must not edit the same file simultaneously. File/subsystem ownership is declared
      explicitly, interfaces are defined first, and integration proceeds in small verified steps. Each
      sub-agent must investigate existing work before changing anything and report: what changed / why
      / what was tested / measurement results / residual risk / affected files. The lead integrator
      holds product vision, architecture, the acceptance table, integration and the final release
      decision.
    scope: operations
    source: docs/directive.md:234; docs/STATE.md:143-153
    epistemic_status: user_requirement
    status: partially_satisfied
    notes: >-
      CORRECTED 2026-08-01. The ownership map existed but assigned no owner to src/main.js — a named
      target of the current action 2 (GB-H2) — nor to src/core/rng.js, src/core/util.js, the
      AI_DEVELOPMENT tree, or the six generated root publication files. An unowned file cannot enforce
      「複数エージェントが同一ファイルを同時に編集しない」. All of them were added to the docs/STATE.md ownership map during the
      migration; the requirement returns to satisfied once that map has been exercised by a real
      multi-owner task.
  - id: REQ-OPS-02
    statement: >-
      Session continuity: docs/STATE.md is the canonical human-facing progress record and must always
      contain current phase / completed work / the next 3 actions as concrete work items / blockers /
      decision changes made after the bible was fixed. Stable IDs, dependencies and logical session
      state are projected into AI_DEVELOPMENT/STATE.yaml and AI_DEVELOPMENT/WORK_GRAPH.yaml with a
      synchronized state_revision, and the active frontier is derived from the work graph rather than
      authored. STATE.md must be updated and committed BEFORE context runs short. Commit in small
      working units; main must always work. Write so that a memoryless new agent can resume from the
      START_HERE.md reading order — node tools/resume_check.mjs checks this mechanically. Each phase
      is a separate PR describing changes, tests run, measurements and residual risk. Task completion,
      turn end, commit, PR and a new chat/Work do NOT end the logical session — only an explicit user
      declaration does.
    scope: operations
    source: docs/directive.md:316-322
    epistemic_status: user_requirement
    status: satisfied
    notes: >-
      Statement updated by the 2026-08-01 migration to name the canonical records. The underlying
      requirement from docs/directive.md section 19 is unchanged; only the files it projects into
      changed.
  - id: REQ-OPS-03
    statement: >-
      Per the user's latest instruction of 2026-07-31, remote push, merge, and public
      publication/deployment of verified checkpoints are PERMANENTLY authorized and persist across
      chat / Work / logical-session changes. This replaces the per-occasion approval rule for exactly
      those three operations and nothing else. Safety boundary: publish only an inspected checkpoint
      with applicable mandatory gates passing; do not expose secrets or perform paid, credential,
      account, destructive production-data or destructive cloud actions.
    scope: operations
    source: docs/STATE.md:83; AI_DEVELOPMENT/PROJECT_STATE.json:21-28
    epistemic_status: user_requirement
    status: satisfied
    constraints:
      - Scoped to remote_push, remote_merge, public_publication_or_deployment only
    notes: >-
      docs/STATE.md:83 records PR #2 and public-compat fix PR #3 merged to main, verified baseline
      `cc96f3a`, both GitHub Pages routes succeeded, and published HTML/JS/CSS/manifest matched the
      production build by SHA-256. Evidence: AI_DEVELOPMENT/EVIDENCE/OPS-REMOTE-PUBLISH.md.
  - id: REQ-OPS-04
    statement: >-
      An existing implementation may be used as a starting point rather than rebuilt from scratch,
      but: the §5 creative discovery must still be run and the incumbent's title/setting/systems must
      not be inherited unconditionally; the existing code must be evaluated against §12 architecture
      and §13 performance budgets, with non-conforming parts remediated or discarded ('it already
      exists' is not a reason to keep it); what was inherited, what was discarded and why must be
      recorded in docs/bible.md; existing assets whose license cannot be confirmed in docs/assets.md
      must not be used; and having a starting point must not widen scope.
    scope: process
    source: docs/directive.md:21-27; docs/bible.md:9-44
    epistemic_status: user_requirement
    status: satisfied
    criteria_refs:
      - A1
    notes: >-
      Inherited (docs/bible.md:19-29): gas simulation, fixed-step simulation, 7-capability
      progression, narrative graph + tools/validate.mjs, real-trigger playthrough harness, Japanese
      localization with the 'game logic never reads translated strings' invariant, generated-asset
      policy. Discarded/remediated (docs/bible.md:31-40): Vitest absence, README's status, the entire
      missing docs/ set, performance scenario coverage; build system explicitly kept.
  - id: REQ-BLOCKER-01
    statement: >-
      BLOCKER B1: 「実機が存在しない。」 No physical device exists; the iPhone SE 3rd generation has never once
      been used for verification. Consequence: Gate D's performance items are in principle not
      automatically verifiable, and the 30 FPS target is a design goal, not a measurement. Only a
      human can resolve it, by executing docs/device-test-checklist.md on real hardware. Until then no
      real-device performance claim of any kind may be made (§13).
    scope: performance/honesty
    source: docs/STATE.md:110; docs/bible.md:496
    epistemic_status: verified_fact
    status: blocked
    constraints:
      - No real-device performance claim until a human executes the checklist
    criteria_refs:
      - B4
      - D8
    notes: >-
      Registered as R-01 at severity 最大 (docs/bible.md:496); docs/device-test-checklist.md 実施回数 0
      (docs/DONE.md:109, docs/STATE.md:60). docs/STATE.md:113: B1 and B2 do not stop work — all other
      work may continue — 「ただしこの2点について検証済みであるかのように書いてはならない。」
  - id: REQ-BLOCKER-02
    statement: >-
      BLOCKER B2: the Japanese text has not been read by a native speaker. Tone and register quality
      cannot be guaranteed. The automated checks (terminology consistency, missing keys, layout
      breakage) do pass. Only a human can resolve this.
    scope: product
    source: docs/STATE.md:111; docs/bible.md:506
    epistemic_status: verified_fact
    status: blocked
    criteria_refs:
      - B1
    notes: "Registered as R-11 at severity medium, 未解決 (docs/bible.md:506): 「自動検査は通っているが、語調と語感は道具で検査できない」."
  - id: REQ-TEST-01
    statement: >-
      Testing coverage required: unit (calculations, progression, combat rules, resources, quest
      conditions, save migration, narrative flags) / integration (player actions, enemy state, mission
      transitions, rewards, UI sync, save-load) / Playwright smoke (startup, input, menus,
      representative gameplay, death-retry, save-reload, full completion) / viewport verification at
      667×375 and other mobile sizes / §13 performance capture / memory growth over long sessions /
      interruption tests (backgrounding, focus loss, rotation, reload, audio resume) / clean-save full
      playthrough / branch and ending verification / regression tests for every fixed critical and
      high.
    scope: engineering
    source: docs/directive.md:291
    epistemic_status: user_requirement
    status: partially_satisfied
    criteria_refs:
      - B2
      - C1
      - C3
      - C5
      - D3
      - D4
      - D7
    notes: >-
      The unit and integration layers do not exist at all (R-06, high, 未着手). Three of nine quests
      (`filters` / `nessaRun` / `cellarRow`) and two of six interiors (`cellar` / `pell`) are outside
      automated verification, and `nessaRun` is never even started on any of the 5 routes — R-18 high,
      未解決, IMP-08 (docs/bible.md:513,533).
  - id: REQ-TEST-02
    statement: >-
      R-08, the 'tests do not execute the verb' defect: every test must be asked whether it actually
      executes the verb it claims to verify, and this question must be built into the Gate B
      acceptance criteria.
    scope: engineering/honesty
    source: docs/bible.md:503
    epistemic_status: accepted_decision
    status: active
    criteria_refs:
      - B5
      - C1
      - D3
    notes: >-
      Severity high. docs/bible.md:503 records the originating incident: melee combat did not function
