    # Wording is deliberate. "installed_observed_failing_not_required" means the
    # mechanism exists, was watched failing on a deliberately bad input, and runs
    # in CI — but cannot yet BLOCK a merge, because `main` has no branch
    # protection (verified 2026-08-01: every branch reports protected=false) and
