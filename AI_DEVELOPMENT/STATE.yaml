#
# docs/STATE.md remains the human-readable product narrative.
# AI_DEVELOPMENT/PROJECT_STATE.json remains the work graph (task ids,
# dependencies, acceptance trace). Neither is a competing authority for the
# fields below; when they disagree with verified reality, verified reality wins
# and all three are corrected.

