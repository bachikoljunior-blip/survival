        Pages deploy, which is after the merge, so requiring it on a pull
        request would be requiring a check that cannot run yet.
    unenforced_items:
      - "F6: the gate is wired into pages.yml after an exact-SHA legacy-ordering check and custom deploy but has not yet run in that workflow. The public surface passed an unstamped content/boot probe; this does not replace the revision-stamped post-deploy job."
      - "revert: no safe rollback mechanism exists. R2-9 means cc96f3a cannot safely consume saves written by current main. revert-to-verified.yml has read-only permissions, validates the canonical target for diagnosis, explains the blocker, and always exits nonzero without creating a branch, PR, deployment or repository write."
    unattended_allowed: false
    note: >-
      Every field above is rewritten to `active` only after the mechanism has
      been observed failing once on a deliberately bad input AND is capable of
      blocking the operation it guards. Writing a gate file never counts as
      installing enforcement, and neither does a job that fails without being
      required.

