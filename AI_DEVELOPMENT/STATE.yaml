      - AI_DEVELOPMENT/EVIDENCE/GB-H2-FAULT-RECOVERY.json
      - AI_DEVELOPMENT/EVIDENCE/GB-TOUCH-SMOKE.json
      - docs/reviews/gate-b-round-h1-h2-touch.md
  modified_but_unverified: []
  current_blockers:
    - id: B1
      statement: No physical device has ever run this build. Gate D performance cannot be verified here.
      who_can_clear: human only, via docs/device-test-checklist.md
    - id: B2
      statement: The Japanese text has never been read by a native speaker.
      who_can_clear: human only
    - id: R2-9
      statement: >-
        A rescued save cannot be reached by the player. There is no restore or
        export path, so "a copy has been kept aside" means a file only devtools
        can open — and the rollback recovery for a migrated save depends on it.
      who_can_clear: a title-screen restore/export entry, not yet built
  review_findings_open:
    note: >-
      GB-H1-REVIEW is PARTIAL. Three lenses were launched; only lens 3
      (player-facing behaviour and integration) completed. It returned FAIL
      with four HIGH findings, all confirmed against the code by the
      implementer before being accepted. The migration engine itself was found
      sound; the defects are all in how the player is told.
      Lens 1 (data loss and the migration contract) and lens 2 (whether the
      gate can pass on broken code) DIED without producing output - see
      AI_DEVELOPMENT/FAILURES.md. They must be re-run. The FAIL verdict does
      not depend on them: lens 3's findings stand on their own.
      Full detail and the fix plan: AI_DEVELOPMENT/HANDOFFS/GB-H1-REVIEW.json
    high:
      - "L3-1: hud.notice caps its queue at four and evicts the OLDEST, and the refusal path emits the failure notice and then calls startNewGame(), which pushes four more. The message that explains the failure is therefore always the one dropped. The one path the change exists to protect is silent."
      - "L3-2: saveFailureText says 'starting a new game will replace it' and the next statement is startNewGame(). The player is not asked, and the save is overwritten about 3.5s later."
      - "L3-3: the title warning is written once at boot and never recomputed, so it survives into states where every clause of it is false (v:99 save -> new game -> quit to title)."
      - "L3-4: a language change calls rebuild(), which builds a fresh empty titleWarn, so the warning is permanently lost - one settings tap away, for exactly the Japanese-speaking player the new strings were written for."
    medium_low:
      - "L3-5: the warning reuses .tagline at 2.6:1 contrast, below WCAG AA, and body.hicontrast does not cover it."
      - "L3-7: the FUTURE message tells the player to open a newer version that, after a rollback, exists nowhere they can reach; NEW GAME has no confirmation when the save is unreadable."
      - "L3-8: director.retry() discards applySave's new boolean, so the half-restored state the guard prevents can still be reached once a future migration produces a payload load() accepts and deserialise rejects."
      - "L3-9: the migrated notice claims the save was updated; nothing is written, and the old-build escape hatch it justifies lasts about three seconds."
      - "L3-10: two-finger CONTINUE + NEW GAME runs both handlers; the loaded save is discarded silently."
      - "L3-11: the textContent/innerHTML split is correct but enforced only by a comment."
    fixed_so_far:
      - "L3-6 (i18n report blind spot): FIXED. tools/i18n_report.mjs scanned a hand-written file list that omitted src/main.js, so every string this change added was invisible while the report still printed interface 100%. The list is now derived from which files import t() from the i18n module. interface went 154/154 -> 165/165 and the six ui.savefile.* keys moved from 'never asked for' to demanded and satisfied."
    gate_lesson: >-
      tools/save_migration.mjs caught none of these. It verifies the stored
      bytes and the restored state, and asserts only that SOME notice matching
      /updated|更新/ exists - never that the player can still see it, never
      that the message is true of what the code then does. Checks for that must
      land with the fixes.

  known_defects_in_our_own_tooling:
    - id: F6-TOOL-PROXY
      statement: >-
        tools/gates/f6_public_revision.mjs uses fetch(), and Node does not read
        proxy settings by default. In this environment every request returns
        403 - not because the public surface is wrong, but because the request
        never leaves. The gate would report a delivery failure that is really a
        tooling failure. GitHub Actions has no proxy so CI is unaffected.
      fix: >-
        NODE_USE_ENV_PROXY=1 makes it work (verified). Set it inside the tool or
        install a proxy-aware dispatcher, so a local run is trustworthy.
      status: known_not_fixed

  network:
    policy_changed: >-
      2026-08-01 the user widened the environment from trusted-registries-only
      to full access. Verified: the published Pages URL, example.com and
      wikipedia.org all returned 403 before and 200 after. WebSearch worked
      even under the narrow policy; page fetching did not.
    consequence: >-
      The public surface is now reachable from the development environment, so
      F6 can be exercised against it directly rather than against a local
      stand-in.

  public_surface_check:
    date: "2026-08-01"
    what: >-
      Fetched index.html, cinderline.1.0.0.js, styles.css and
      manifest.webmanifest from the live Pages URL and compared SHA-256 against
      the same files committed at origin/main (193f408).
    result: >-
      All four byte-identical. The live site is exactly what origin/main has
      committed. This is the first direct confirmation since 193f408 was
      merged; the previous evidence covered cc96f3a only.
    limitation: >-
      This verifies the F6 method against the real public surface. It does NOT
      verify the F6 job in pages.yml, which has still never run, because that
      only happens on a real deploy.

  current_uncertainty:
    - The shipped save-migration chain has one step, so staged multi-version migration is proved only against an injected registry.
    - The browser layer of the save gate has no automated negative control; its ability to fail has been observed by hand only.
    - A rolled-back release cannot read a migrated save. The pre-upgrade bytes are kept, but nothing offers them back (R2-9).
  exact_next_action: >-
    Merge this round through pull request #6 once the floor gates are green
    (F2/F3/F5), then verify the public surface with
    tools/gates/f6_public_revision.mjs and record the served revision. The two
    findings this round did not fix are R2-9 (a rescued save has no restore or
    export path, which the rollback recovery depends on) and R2-10
    (available() reports "nothing will be kept" on a full quota while writes to
    the existing key still succeed). Take R2-9 first: it is the one that makes
    "a copy has been kept aside" mean something to a player.

