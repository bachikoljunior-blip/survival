  independence_level_used: C
  skips:
    - "F6: ATTEMPTED AND BLOCKED, still owed. main moved to e0b2815 and the Pages deployment for that revision reports success, but tools/gates/f6_public_revision.mjs cannot reach the public surface from this environment: the egress proxy answers 403 to CONNECT for bachikoljunior-blip.github.io:443 (measured 2026-08-01T15:56:50Z, recorded in the proxy's own recentRelayFailures). A deployment job reporting success is not evidence of what a visitor receives, so this delivery is NOT recorded as publicly verified. Note: an earlier entry in this file claimed the policy had been widened and the Pages URL returned 200; that is contradicted by this measurement."
    - "F7: not fired. No objective was marked complete this run; GATE-B remains in progress."
    - "F5 limitation: the Level A lens was source-blind and returned a verdict (claim 1 FAIL, the rest PASS), but it tested the bundle as it stood before the other lenses' findings were fixed, and it did NOT re-verify afterwards. Its two findings were reproduced and regression-checked by this session instead, which is Level C for that step. Recorded rather than smoothed over."
    - "F5 coverage: the browser layer of tools/save_migration.mjs has no automated negative control. Its ability to fail was observed by hand only."
    - "F5 for THIS delivery is Level C, not the A recorded for the round before it. This run integrates another session's benchmark work; what was falsified here is the INTEGRATION — that the conflict resolution dropped nothing and that the merged tree runs — by reading both sides and running the full suite. The benchmark content itself (docs/benchmarks.md, the 71 criteria, the lock) has NOT been independently reviewed by this session. The A-level record for GB-H1/H2/touch stands in docs/reviews/gate-b-round-h1-h2-touch.md and in merged history."
  waivers: []
  enforcement:
    # Wording is deliberate. "installed_observed_failing_not_required" means the
    # mechanism exists, was watched failing on a deliberately bad input, and runs
    # in CI — but cannot yet BLOCK a merge, because `main` has no branch
    # protection (verified 2026-08-01: every branch reports protected=false) and
    # this session has no capability to configure required status checks.
    # Measured, not read from a settings page. With the ruleset active on main,
    # pull request #5 reports mergeable_state "blocked" while F5 is red - the
    # gate is actually stopping the operation it guards. Before the ruleset it
    # reported "unstable" (checks red, merge still permitted) on two separate
    # reads, which is what made the difference observable rather than assumed.
    f2_state_update_check: active
    f3_execution_check: active
    f5_review_record_check: active
    f6_public_revision_check: prepared_not_executed
    revert_mechanism: prepared_not_executed
    last_observed_failing: |
      2026-08-01, all locally executed and watched:
      F2  tools/gates/f2_state_update.mjs --base HEAD~1 -> exit 1. Real input:
          commit 012009b changed 8 product files with no STATE.yaml update.
      F3  tools/gates/f3_execution.mjs -> exit 1 on a real defect it found, the
          committed Pages root mirror being stale against dist/ after the save
          migration landed. Passed at exit 0 once the mirror was regenerated.
          In CI it completes green in 2m04s including chromium install, the
          production build and the browser save-migration gate (run 1 of the
          Floor gates workflow, 19f7235).
      F5  tools/gates/f5_review_record.mjs -> exit 1 on three distinct bad
          inputs (no review trailer; level D claimed as a pass; a trailer
          disagreeing with STATE.yaml). Exit 0 on a valid record. In CI it has
          failed on every run of PR #5 so far, by design, because the review
          was still in flight.
      F6  tools/gates/f6_public_revision.mjs -> exit 1 against a local server
          serving a tampered index.html, and again against one serving a
          previous-revision bundle. Exit 0 on a byte-exact match.
      Validator: five negative controls against tools/check_operating_state.mjs
          (drifted active work, unattended allowed with gates absent, invalid
          independence level, missing enforcement field, missing STATE.yaml).
      Blocking proven: PR #5 mergeable_state went unstable -> blocked when the
          ruleset was created with these three as required status checks.
    ruleset:
      target: default branch (main)
      enforcement: Active
      bypass_list: empty
      required_checks: [F2 state update, F3 execution, F5 review record]
      configured_by: the user, 2026-08-01, in the GitHub UI
      note: >-
        F6 is deliberately NOT a required pull-request check. It runs after the
        Pages deploy, which is after the merge, so requiring it on a pull
        request would be requiring a check that cannot run yet.
    unenforced_items:
      - "F6: the gate is wired into pages.yml after deploy but has NEVER run there. It cannot be exercised from the development environment either - outbound HTTPS is denied by egress policy (403 on the Pages URL and on example.com alike), so the real public surface is unreachable from there. Verified against the shipped build only through a local server."
      - "revert: revert-to-verified.yml is deliberately manual-dispatch, never executed. Automatic revert was not wired because it would push to main from CI unprompted."
    unattended_allowed: false
    note: >-
      Every field above is rewritten to `active` only after the mechanism has
      been observed failing once on a deliberately bad input AND is capable of
      blocking the operation it guards. Writing a gate file never counts as
      installing enforcement, and neither does a job that fails without being
      required.

automation:
  pages_deploy:
    file: .github/workflows/pages.yml
    trigger: push to main, plus manual dispatch
    post_deploy_verification: absent
    revert: absent
  autopilot:
    file: .github/workflows/autopilot.yml
    kind: unattended, delivery-capable, self-restarting
    trigger: workflow_dispatch only, no schedule
    in_flight_at_migration: false
    last_run: "2026-07-30T09:17Z, run 5, completed"
    satisfies_section_0_4: false
    why_not: >-
      It squash-merges its own pull request to main and deliberately uses a PAT
      so the Pages deploy fires, but none of the four F9 gates are active, there
      is no post-deploy revision check and no automatic revert. Its own stop
      conditions (docs/STOP on the default branch, ALL_DONE, chain >= 20,
      merge-must-succeed) satisfy only the stop-mechanism half of 0.4.
    disposition: >-
      OFF by explicit user instruction, 2026-08-01 ("オートパイロットはオフで").
      This is a user decision, not only a protocol consequence, and it outranks
      the 0.4 argument that produced the same answer: do not re-enable it even
      if the four gates later become active, until the user says otherwise.
      docs/STOP is committed on this branch so that merging arms the workflow's
      own brake on the default branch. Note the brake stops the CHAIN only - a
      single manual dispatch would still run three rounds and merge. Fully
      disabling it requires the GitHub UI (Actions -> Autopilot -> Disable
      workflow); no API for that is exposed to this session, verified by
      searching the available tools.

