    # Measured, not read from a settings page. With the ruleset active on main,
    # pull request #5 reports mergeable_state "blocked" while F5 is red - the
    # gate is actually stopping the operation it guards. Before the ruleset it
    # reported "unstable" (checks red, merge still permitted) on two separate
    # reads, which is what made the difference observable rather than assumed.
    f2_state_update_check: active
    f3_execution_check: active
    f5_review_record_check: active
    f6_public_revision_check: prepared_not_executed
    revert_mechanism: prepared_not_executed
    last_observed_failing: |
      2026-08-01, all locally executed and watched:
      F2  tools/gates/f2_state_update.mjs --base HEAD~1 -> exit 1. Real input:
          commit 012009b changed 8 product files with no STATE.yaml update.
      F3  tools/gates/f3_execution.mjs -> exit 1 on a real defect it found, the
