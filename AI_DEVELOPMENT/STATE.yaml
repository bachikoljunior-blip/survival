    kind: unattended, delivery-capable, self-restarting
    trigger: workflow_dispatch only, no schedule
    in_flight_at_migration: false
    last_run: "2026-07-30T09:17Z, run 5, completed"
    satisfies_section_0_4: false
    why_not: >-
      It squash-merges its own pull request to main and deliberately uses a PAT
      so the Pages deploy fires, but none of the four F9 gates are active, there
      is no post-deploy revision check and no automatic revert. Its own stop
      conditions (docs/STOP on the default branch, ALL_DONE, chain >= 20,
      merge-must-succeed) satisfy only the stop-mechanism half of 0.4.
    disposition: >-
      OFF by explicit user instruction, 2026-08-01 ("オートパイロットはオフで").
      This is a user decision, not only a protocol consequence, and it outranks
      the 0.4 argument that produced the same answer: do not re-enable it even
      if the four gates later become active, until the user says otherwise.
      docs/STOP is committed on this branch so that merging arms the workflow's
      own brake on the default branch. Note the brake stops the CHAIN only - a
      single manual dispatch would still run three rounds and merge. Fully
      disabling it requires the GitHub UI (Actions -> Autopilot -> Disable
      workflow); no API for that is exposed to this session, verified by
      searching the available tools.

