      - AI_DEVELOPMENT/EVIDENCE/GB-TOUCH-SMOKE.json
      - docs/reviews/gate-b-round-h1-h2-touch.md
      - AI_DEVELOPMENT/EVIDENCE/BENCH-BASELINE.json
  modified_but_unverified:
    - "revert-to-verified.yml YAML repair: the file now parses (js-yaml, and the kit parser) and every run block is shell-valid under `bash -n`. NOT yet observed on GitHub — the proof is that pushing stops producing a zero-job run named after the file path. Until a push is observed, this is complete_unverified."
