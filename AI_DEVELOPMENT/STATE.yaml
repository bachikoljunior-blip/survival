  last_verified_checkpoint:
    revision: pending-merge-of-claude/round-remaining-work-di4vbu
    what: >-
      Two parallel implementations of GB-H1 reconciled into one, plus GB-H2 and
      GB-TOUCH-SMOKE. The migration keeps the published storage key and puts the
      version on the envelope; a save this build cannot read is copied into a
      rescue LIST before the new game that follows can overwrite it; the loader
      and deserialise now share one predicate for "can this build read it".
      tools/save_migration.mjs 129 checks with six negative controls, each bound
