automation:
  pages_deploy:
    file: .github/workflows/pages.yml
    trigger: push to main, plus manual dispatch
    pre_deploy_gates: Playwright WebKit, then iPhone SE 3 iOS Simulator / Mobile Safari
    post_deploy_verification: tools/gates/f6_public_revision.mjs after deploy
    revert: absent
  autopilot:
    file: .github/workflows/autopilot.yml
    kind: unattended, delivery-capable, self-restarting
    trigger: workflow_dispatch only, no schedule
    in_flight_at_migration: false
    last_run: "2026-07-30T09:17Z, run 5, completed"
    satisfies_section_0_4: false
    why_not: >-
      It squash-merges its own pull request to main and deliberately uses a PAT
      so the Pages deploy fires, but none of the four F9 gates are active, there
      is no post-deploy revision check and no automatic revert. Its own stop
      conditions (docs/STOP on the default branch, ALL_DONE, chain >= 20,
      merge-must-succeed) satisfy only the stop-mechanism half of 0.4.
    disposition: >-
