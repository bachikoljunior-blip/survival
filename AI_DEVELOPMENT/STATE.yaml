      target: default branch (main)
      enforcement: Active
      bypass_list: empty
      required_checks: [F2 state update, F3 execution, F5 review record]
      configured_by: the user, 2026-08-01, in the GitHub UI
      note: >-
        F6 is deliberately NOT a required pull-request check. It runs after the
