    - "ios-safari toolchain fix in pages.yml: the jq runtime selection was exercised against synthetic simctl JSON for four Xcode SDK ceilings (26 -> 26.2, 18 -> 18.5, 17 -> 17.0, 16 -> refusal) and the sed against real `xcodebuild -showsdks` shapes. The macOS half — xcode-select, the actual WDA build, the raised wdaLaunchTimeout — CANNOT be executed in this environment and has never run. This is the one change most likely to still be wrong."
    - "Shared-kit integration: MERGED. Pull requests #10, #11 and #12 all landed; main is b404ee8. The record below that describes this as an unmerged branch is superseded and kept only for its disproved/equivalence notes."
  release_machinery_findings:
    measured_on: "2026-08-02, against GitHub Actions runs 30722732856, 30734830183, 30744623114 and 30744622824"
    note: >-
      All three were found by looking at what GitHub actually did with main
      after the merges, rather than at what the workflow files say they do.
      None of the three was visible from the repository alone.
    RM-1:
      statement: >-
        revert-to-verified.yml has never been a workflow. A `git commit -m` whose
        second paragraph began at column 1 terminated the enclosing `run: |`
        block scalar, so the file is not valid YAML. GitHub responds to an
        unloadable workflow by creating a run named after the FILE PATH, failing
        it in under a second with zero jobs, and saying nothing else. Run 48 of
        that non-workflow was the b404ee8 push.
      why_the_record_missed_it: >-
        The record called the revert mechanism `prepared_not_executed` — present
        but never exercised. That was too generous: it could not be dispatched at
        all, because GitHub had nothing to dispatch. `unenforced_items` reasoned
        about why automatic revert was deliberately not wired, which read as
        deliberate restraint over what was simply a broken file.
      status: complete_unverified
      fix: >-
        Two -m arguments instead of one multi-line string, plus
        tools/check_workflows.mjs so no workflow file can ever again be
        unparseable without a local check failing first.
    RM-2:
      statement: >-
        The ios-safari job has failed on every push to main since it landed
        (02339ce, 325b1e1, b404ee8) and takes `deploy` and the F6 job with it —
        both are `skipped`, which is why F6 has STILL never run anywhere. Root
        cause, from the job's own appium.log: the runner's active Xcode was 16.4
        while the simulator-selection step took the newest installed runtime,
        iOS 26.2. appium therefore ran xcodebuild with
        IPHONEOS_DEPLOYMENT_TARGET=26.2 against a toolchain with no such SDK.
        xcodebuild exited early, WebDriverAgent never listened on port 8100, and
        the only surfaced symptom was `connect ECONNREFUSED 127.0.0.1:8100`
        after two 60s attempts.
      contributing: >-
        appium's default wdaLaunchTimeout is 60s and a cold WebDriverAgent build
        is minutes, so the timeout would have been marginal even with a matched
        toolchain. `showXcodeLog` was off, which is why the cause needed an
        artifact download rather than being in the job log.
      status: complete_unverified
      fix: >-
        Select the newest installed Xcode, read its maximum iphonesimulator SDK,
        and choose the newest iPhone SE 3 runtime that toolchain can build for —
        refusing loudly with the runtime list if none qualifies. Raise
        wdaLaunchTimeout to 480s, persist DerivedData, turn on showXcodeLog.
        The macOS half of this is UNEXECUTED here; see modified_but_unverified.
    RM-3:
      statement: >-
        The two gates in pages.yml are not pre-deploy gates. Pages is served from
        the branch-source root mirror (decision OD-005), so GitHub's own "pages
        build and deployment" run publishes a push within seconds of it landing.
        For b404ee8 that finished at 10:53:07. The WebKit gate finished at
        10:54:45 and the iOS gate failed at 11:02:31 — the build had been public
        for nine minutes before either verdict existed, and the failing gate
        could not and did not withdraw it.
      what_this_does_not_show: >-
        No bad build reached anyone. The product bundle is byte-identical across
        b5f5f94, 02339ce, 325b1e1 and b404ee8 — these were tooling and record
        commits only. That also means the F6 byte comparison run this session
        CANNOT discriminate which path published; the ordering claim rests on
        the timestamps and OD-005, not on the byte match.
      status: inconclusive
      why_inconclusive: >-
        Whether the Actions `deploy` job is a second live publisher or dead
        weight against a branch-source setting was NOT determined. The Pages
        source setting itself was not read — no tool available to this session
        exposes it. Both readings are consistent with what was measured, and
        they imply different repairs, so no change was made to the deploy path.
      next_step: >-
        Read the repository's Pages source setting. If it is `main/(root)`,
        either drop the Actions deploy/F6 jobs and move verification to a
        post-push workflow, or move Pages to the Actions source so the gates can
        actually precede publication. Do not "fix" this by guessing which.

  current_blockers:
    - id: B1
      statement: >-
        No physical device has ever run this build. Gate D FPS, GPU, heat,
        memory-pressure eviction, real-glass reach/feel, haptics and audio
        latency cannot be verified here. This remains an evidence limitation,
        not a routine release blocker.
      who_can_clear: human only, via docs/device-test-checklist.md
    - id: B2
      statement: The Japanese text has never been read by a native speaker.
      who_can_clear: human only
    - id: R2-9
      statement: >-
        A rescued save cannot be reached by the player. There is no restore or
        export path, so "a copy has been kept aside" means a file only devtools
        can open — and the rollback recovery for a migrated save depends on it.
      who_can_clear: a title-screen restore/export entry, not yet built
  review_findings_open:
    note: >-
      GB-H1-REVIEW is PARTIAL. Three lenses were launched; only lens 3
      (player-facing behaviour and integration) completed. It returned FAIL
      with four HIGH findings, all confirmed against the code by the
      implementer before being accepted. The migration engine itself was found
      sound; the defects are all in how the player is told.
      Lens 1 (data loss and the migration contract) and lens 2 (whether the
      gate can pass on broken code) DIED without producing output - see
      AI_DEVELOPMENT/FAILURES.md. They must be re-run. The FAIL verdict does
      not depend on them: lens 3's findings stand on their own.
      Full detail and the fix plan: AI_DEVELOPMENT/HANDOFFS/GB-H1-REVIEW.json
    high:
      - "L3-1: hud.notice caps its queue at four and evicts the OLDEST, and the refusal path emits the failure notice and then calls startNewGame(), which pushes four more. The message that explains the failure is therefore always the one dropped. The one path the change exists to protect is silent."
      - "L3-2: saveFailureText says 'starting a new game will replace it' and the next statement is startNewGame(). The player is not asked, and the save is overwritten about 3.5s later."
      - "L3-3: the title warning is written once at boot and never recomputed, so it survives into states where every clause of it is false (v:99 save -> new game -> quit to title)."
      - "L3-4: a language change calls rebuild(), which builds a fresh empty titleWarn, so the warning is permanently lost - one settings tap away, for exactly the Japanese-speaking player the new strings were written for."
    medium_low:
      - "L3-5: the warning reuses .tagline at 2.6:1 contrast, below WCAG AA, and body.hicontrast does not cover it."
      - "L3-7: the FUTURE message tells the player to open a newer version that, after a rollback, exists nowhere they can reach; NEW GAME has no confirmation when the save is unreadable."
      - "L3-8: director.retry() discards applySave's new boolean, so the half-restored state the guard prevents can still be reached once a future migration produces a payload load() accepts and deserialise rejects."
      - "L3-9: the migrated notice claims the save was updated; nothing is written, and the old-build escape hatch it justifies lasts about three seconds."
      - "L3-10: two-finger CONTINUE + NEW GAME runs both handlers; the loaded save is discarded silently."
      - "L3-11: the textContent/innerHTML split is correct but enforced only by a comment."
    fixed_so_far:
      - "L3-6 (i18n report blind spot): FIXED. tools/i18n_report.mjs scanned a hand-written file list that omitted src/main.js, so every string this change added was invisible while the report still printed interface 100%. The list is now derived from which files import t() from the i18n module. interface went 154/154 -> 165/165 and the six ui.savefile.* keys moved from 'never asked for' to demanded and satisfied."
    gate_lesson: >-
      tools/save_migration.mjs caught none of these. It verifies the stored
      bytes and the restored state, and asserts only that SOME notice matching
      /updated|更新/ exists - never that the player can still see it, never
      that the message is true of what the code then does. Checks for that must
      land with the fixes.

  known_defects_in_our_own_tooling:
    - id: F6-TOOL-PROXY
      statement: >-
        tools/gates/f6_public_revision.mjs uses fetch(), and Node does not read
        proxy settings by default. In this environment every request returns
        403 - not because the public surface is wrong, but because the request
        never leaves. The gate would report a delivery failure that is really a
        tooling failure. GitHub Actions has no proxy so CI is unaffected.
      fix: >-
        NODE_USE_ENV_PROXY=1 makes it work (verified). Set it inside the tool or
        install a proxy-aware dispatcher, so a local run is trustworthy.
      status: known_not_fixed

  network:
