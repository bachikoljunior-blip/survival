  kit_integration:
    branch: claude/kit-rollout-integration-a4zihp
    rebuilt_on: 02339ce10e63145adf7155ca6b4b1dc2ff7d7f60
    why_rebuilt_not_merged: >-
      The kit branch rewrote tools/check_operating_state.mjs whole (262 added,
      121 removed) while c8608a6 was adding 84 lines of protocol-2.2 STATE.yaml
