    unenforced_items:
      - "F6: the gate is wired into pages.yml after deploy and has STILL never run there. The reason is now known and is not scheduling: `verify` needs `deploy`, `deploy` needs `ios-safari`, and ios-safari has failed on every push since it landed, so both are skipped (run 30744623114, jobs 91488840567 and 91488840573 — both `skipped`). Fixing RM-2 is a precondition for F6 ever running at all."
      - "revert: revert-to-verified.yml was NOT 'deliberately manual-dispatch, never executed'. It was unloadable YAML and therefore not dispatchable at all — see RM-1. The manual-dispatch design decision is real and unchanged, but it was never what stopped this from running. Repaired this run, not yet confirmed on GitHub."
      - "F6 from this environment: the four published files were fetched and are byte-identical to the local build (with NODE_USE_ENV_PROXY=1, which the tool still does not set for itself — see F6-TOOL-PROXY). The gate still exits 1, because its boot check drives Chromium at the public URL and the sandbox proxy resets that connection. So the bytes are confirmed and the runtime boot is not."
    unattended_allowed: false
    note: >-
      Every field above is rewritten to `active` only after the mechanism has
