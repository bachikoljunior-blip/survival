      work and was not merely declined. That parser is strict and rejects
      folded block scalars; this file uses them, and it throws at line 22 of
      the real file. main's hand-rolled indentation walker is kept verbatim
      with only its I/O made injectable.
    equivalence: >-
      46 of 46 mutations of the real state reach the same verdict in the
      rebuilt validator and the one at the pinned pre-integration revision
      02339ce, run as subprocesses because that version has no CLI guard and
      executes on import. 43 of the 45 breakages fire; the 2 that do not are
      deliberate valid-input controls. The previous 27/27 was measured against
      the old main and is void. Battery:
      tools/equivalence_operating_state.mjs.
    equivalence_base_is_pinned: >-
      The battery's base is the fixed revision 02339ce, not origin/main, and it
      throws if the base resolves to the same source as the working tree. Both
      guards exist because the integration merged: a base tracking origin/main
      would now compare the validator against itself and print a confident 46/46
      that means nothing. It also no longer reads the old copy from a hardcoded
      /tmp path, which did not survive a new session.
    vantage_noise: >-
      The 18-frame sweep was NOT used to check the harness swap on this tree,
      and one before/after pair could not have settled it: two runs of the
      unmodified harness against one byte-identical dist differ on 11 of 18
      frames. That control was measured on the previous base and is not
      re-derived here.
    launch_swap_is_three_changes: >-
      The four Chromium launches in tools/{shot,perf,playthrough,vantage}.mjs
      still carry their own flag arrays. The record describes adopting
      .kit/lib/browser/launchHeadless as adding two flags. Determined
      statically this run - no browser launched, so none of it is subject to
      the sweep noise above - it is THREE changes, and the flags are the
      smallest.
      (1) Five flags added, none removed, measured by injecting a spy driver
      through launchHeadless's own `chromium` option: --enable-webgl,
      --disable-dev-shm-usage, --hide-scrollbars, --mute-audio,
      --force-color-profile=srgb. Two of those can move pixels.
      (2) A DIFFERENT CHROMIUM BINARY, and this is unrecorded anywhere. Our
      calls pass no executablePath and no headless key; Playwright defaults
      headless true, and chromium.js getExecutableName returns
      "chromium-headless-shell" - so today we run
      /opt/pw-browsers/chromium_headless_shell-1194/chrome-linux/headless_shell.
      launchHeadless passes an explicit executablePath, which takes the other
      branch in browserType.js, so it would run
      /opt/pw-browsers/chromium-1194/chrome-linux/chrome. Two different 300MB
      binaries. HYPOTHESIS, not yet disproved: if the swap moves frames this is
      the cause, not the colour profile. Bisect before believing the flags.
      (3) launchHeadless defaults proxy:true and HTTPS_PROXY is set here, so it
      passes proxy:{server:...}; Playwright then force-appends "<-loopback>" to
      --proxy-bypass-list, which UN-bypasses loopback. All four harnesses serve
      dist/ from a 127.0.0.1 static server and none of them talks to the public
      internet. Same family as the F6-TOOL-PROXY defect already recorded above.
      The fix is in the kit's existing API: pass proxy:false. Whether the
      proxied-loopback launch actually fails to reach the harness, or silently
      succeeds because the egress proxy shares this container's loopback, is
      NOT yet measured - a silent success is the worse outcome because it would
      make every future run depend on the proxy being up.
    launch_swap_proxy_blocker_measured: >-
      MEASURED, not inferred, and it is a hard blocker on adopting launchHeadless
      as the kit ships it. With the kit's default proxy:true, navigating to this
      harness's own loopback server returns HTTP 405. With proxy:false the same
      navigation returns 200 and the real page title. The failure mode is the
      dangerous kind: 405 arrives with ZERO page errors, so a harness proceeds and
      then times out waiting for CINDERLINE.ready, which reads as a boot failure in
      the game rather than a proxy misconfiguration. Cause, read out of
      playwright-core: whenever a proxy is configured Playwright force-appends
      "<-loopback>" to --proxy-bypass-list, which UN-bypasses loopback. Any harness
      in any repo that serves its own content on 127.0.0.1 and adopts launchHeadless
      without proxy:false will break the same way; the kit's default is wrong for
      that whole class of caller, and its own doc comment says the proxy option
      exists for reaching PUBLIC urls. Recorded against the kit, not fixed here.
    vantage_noise_characterised: >-
      Eight baseline sweeps against one dist hash a07b10b236ef, 18 frames x 11
      cells. Ranges: 118 cells range 0, 53 range 1, 8 range 2, 19 range >2 - and 17
      of those 19 are tris. The luma columns are near-deterministic; the frame-level
      "11 of 18 frames differ" that blocked this swap was hiding that nearly all the
      movement is triangle counts, not pixels. Leave-one-out false-positive rate by
      column: warm and draws 0.0%, p25/cool 1.4%, p05/p75/iqr 2.8%, p50/black 3.5%,
      p95/tris 4.9%; luma overall 2.55%, draws+tris 2.43%. The band therefore never
      reaches zero false positives and a verdict of "any cell moved" is unusable, so
      two nulls are computed from the baseline itself: null 1, per-sweep out-of-band
      count leave-one-out = {0,8,5,2,3,8,2,12}, range 0-12 mean 5.0; null 2,
      split-half persistence (band from runs 1-4, cells outside in ALL of runs 5-8)
      = 1, slip_bridge|tris. A candidate is signal only if it beats those.
    cinder_line_black_trap_not_reproduced: >-
      The record's trap says v-cinder_line renders 100% black about two runs in
      three, and that when it does it drops to 73 draws / 769,251 triangles. Across
      8 baseline sweeps here it was NEVER black - black 0.0%, p50 84, every run -
      and its draws/tris were 73 / 769,247-769,251 in ALL of them. So on this build
      that draw/triangle signature is the HEALTHY state, and the draw-count drop
      cannot be used as the black-frame tell the record offers. Not a disproof of
      the black frame itself, which was observed on an older build; it does retire
      the diagnostic. cinder_line is one of the 18 frames the critics judge from.
    launch_swap_SETTLED: >-
      RESULT: adopting .kit/lib/browser/launchHeadless in tools/vantage.mjs is
      UNDETECTABLE on this rig, and every apparent difference was batch drift.
      Five arms of 4 sweeps each against one dist hash a07b10b236ef, plus an
      8-sweep baseline: 28 sweeps, 504 frames total. Raw samples are preserved at
      AI_DEVELOPMENT/EVIDENCE/VANTAGE-LAUNCH-SWAP-SAMPLES.jsonl because shots/ is
      gitignored and would not survive the container. Net luma shift vs baseline
      and sign-test asymmetry - legacynow (THE CONTROL, no change at all) -17.4
      asym 10; kitfull -14.4 asym 20; kitfull2 (replication of kitfull) -20.6
      asym 9; binary -7.1 asym 4; flags -16.1 asym 6. The control, which changed
      NOTHING, darkened more than the swap did. binary and flags are both inside
      the control on both measures. The two kitfull arms exceed the control on
      DIFFERENT measures and each sits inside it on the other - the signature of
      noise, since a real effect would exceed the same measure both times.
      status: complete_verified for the question asked (can this rig tell the
      configurations apart? no). It is NOT a claim that the frames are identical.
    launch_swap_binary_hypothesis_DISPROVED: >-
      The recorded hypothesis - that the headless_shell -> full chrome binary
      change was the likely pixel-mover and the flags the smaller suspect - is
      disproved. The binary-only arm is the QUIETEST of all six (total -7.1,
      asymmetry 4, 6 unique cells outside band against a baseline-split minimum
      of 9). Recorded so it is not re-derived. NOTE: the commit message for
      ab65a46 says "six arms ... 44 sweeps, 792 frames"; that count was wrong and
      is corrected here to five arms, 28 sweeps, 504 frames. Every per-arm number
      it quotes is unaffected.
    launch_swap_my_own_false_positive: >-
      Recorded because the mechanism is general and cost this session real time.
      The first kitfull arm was reported as a measured DIRECTIONAL SHIFT: 31 luma
      cells down against 11 up, asymmetry 20, "exceeds every one of the 70
      baseline 4/4 splits (max 17)". The arithmetic was right and the conclusion
      was wrong, because the NULL was invalid for the comparison. 68 of those 70
      splits interleave the two baseline collection batches, which cancels
      batch-to-batch drift by construction - while every candidate arm IS a
      separate later batch. A null built by splitting one baseline structurally
      cannot contain the effect being tested for. Three independent things then
      contradicted the finding: the bisect refused to corroborate it (neither
      component reproduced it), magnitude disagreed with sign (flags darkened
      MORE while showing a third of the asymmetry), and replication of the same
      configuration dropped the asymmetry from 20 to 9. The fix is not a better
      computed null: it is a CONTROL ARM - the unchanged configuration collected
      as a separate later batch - which outranks any null derived from splitting
      the baseline. tools/vantage_distribution.mjs --control now implements this
      and its verdict is gated on it.
    vantage_rig_batch_drift: >-
      The property that made all of the above necessary, and it is a fact about
      the apparatus that outlives this swap. The sweep drifts between COLLECTION
      BATCHES by about as much as any configuration change moves it: within the
      baseline alone, runs 1-4 vs runs 5-8 differ by +16.9 total with asymmetry
      12. Any before/after taken as two separate batches therefore carries a
      built-in difference of that size regardless of what changed. Interleave the
      arms, or run a same-config control batch alongside, or the comparison is
      measuring elapsed time.

