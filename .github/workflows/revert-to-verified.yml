# Diagnose a request to restore the revision last verified on the public site.
#
# This workflow is intentionally read-only and always exits non-zero. R2-9 is
# unresolved: a product rollback to the recorded revision can strand saves
# written by current main because that revision does not understand the newer
# save format. Until a forward-compatible recovery path is implemented and
# independently reviewed, this workflow must not create branches, pull
# requests, deployments, or writes to main.
#
#   gh workflow run revert-to-verified.yml --ref main \
#     -f revision=<remote.verified_public_revision> -f confirm=DIAGNOSE_ROLLBACK
name: Diagnose verified-revision rollback

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full SHA currently recorded as remote.verified_public_revision'
        required: true
        type: string
      confirm:
        description: 'Type DIAGNOSE_ROLLBACK; this workflow never changes the repository'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback-is-unsafe:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an ambiguous dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if test "$GITHUB_REF" != 'refs/heads/main'; then
            echo "::error::Dispatch this diagnostic from main so its state authority is canonical."
            exit 1
          fi
          if test "$CONFIRMATION" != 'DIAGNOSE_ROLLBACK'; then
            echo "::error::confirm must be exactly DIAGNOSE_ROLLBACK. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate the requested diagnostic target
        shell: bash
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          node tools/gates/verified_revert_request.mjs --revision "$REQUESTED_REVISION"
          git cat-file -e "${REQUESTED_REVISION}^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_REVISION" HEAD; then
            echo "::error::The canonical verified revision is not an ancestor of current main."
            exit 1
          fi

      - name: Stop because rollback is not save-compatible
        shell: bash
        run: |
          echo "::error::R2-9 is unresolved: the recorded verified revision cannot safely read saves written by current main."
          echo "No branch, pull request, deployment, or repository write was attempted."
          echo "Keep the deployment stopped, preserve evidence, and use a reviewed forward repair/redeploy incident response."
          echo "A verified-revision rollback remains unavailable until save compatibility and its recovery gates are implemented."
          exit 1
