# Build CINDERLINE and publish dist/ to GitHub Pages.
#
# The build is fully static and uses only relative paths, so it works from a
# project-site subdirectory (https://<user>.github.io/<repo>/) without any
# base-path configuration.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate persistent operating state
        run: npm run validate:ops
      - name: Validate that every workflow file still loads
        run: npm run validate:workflows
      - name: Validate story and world content
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Validate branch-source mirror
        run: npm run validate:pages-root
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Exercise the iPhone SE 3 WebKit surface
        env:
          CINDERLINE_REQUIRE_BASELINE: "1"
        run: npm run test:iphone-webkit
      - name: Preserve WebKit screenshots, video, trace and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-se3-webkit-${{ github.sha }}
          path: test-results/iphone-webkit
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  ios-safari:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out WebKit-verified source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore exact dependencies and rebuild
        run: |
          npm ci
          npm run validate:ops
          npm run validate
          npm run build
          npm run validate:pages-root
      - name: Install pinned Appium and XCUITest driver
        run: |
          npm install --global appium@3.6.0
          appium driver install xcuitest@12.1.3
          appium driver list --installed
      # WebDriverAgent is compiled by the ACTIVE Xcode and then has to run on the
      # chosen simulator runtime. Those are two independent selections, and on
      # 2026-08-02 they disagreed: the runner's active Xcode was 16.4 while the
      # newest installed runtime was iOS 26.2, so appium invoked xcodebuild with
      # IPHONEOS_DEPLOYMENT_TARGET=26.2 against a toolchain with no such SDK.
      # xcodebuild exited, WDA never listened on port 8100, and the job's only
      # symptom was `ECONNREFUSED 127.0.0.1:8100` five minutes later — a message
      # that names the socket and not the cause. Pin the toolchain first, then
      # choose a runtime it can actually build for.
      - name: Select the Xcode toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          # The highest iOS simulator SDK this toolchain can build against.
          max_major="$(xcodebuild -showsdks \
            | sed -nE 's/.*-sdk iphonesimulator([0-9]+)(\.[0-9]+)?.*/\1/p' \
            | sort -n | tail -1)"
          test -n "$max_major"
          echo "Active Xcode: $newest (max iOS simulator SDK major: $max_major)"
          echo "max_major=$max_major" >> "$GITHUB_OUTPUT"

      - name: Select and boot iPhone SE 3 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          selection="$(xcrun simctl list devices available --json | jq -r \
            --argjson maxmajor "${{ steps.toolchain.outputs.max_major }}" '
            [.devices | to_entries[] | .key as $runtime | .value[] |
             select(.name == "iPhone SE (3rd generation)" and .isAvailable == true) |
             ($runtime | sub(".*SimRuntime\\.iOS-"; "") | split("-") | map(tonumber)) as $v |
             {udid: .udid, runtime: $runtime, major: $v[0], minor: ($v[1] // 0)}] |
            map(select(.major <= $maxmajor)) |
            sort_by(.major, .minor) | last |
            # `last` on an empty array is null, and indexing null yields the
            # string "null.null" rather than nothing — which would sail past the
            # emptiness check below and fail later without saying why.
            if . == null then empty
            else [.udid, ((.major | tostring) + "." + (.minor | tostring))] | @tsv
            end')"
          if test -z "$selection" || test "$selection" = "null"; then
            echo "::error::No iPhone SE (3rd generation) runtime is buildable by this Xcode."
            echo "Installed runtimes:"
            xcrun simctl list runtimes
            echo "This is a refusal, not a skip: a lower-fidelity substitute device"
            echo "would make the gate report a pass for a target nobody asked about."
            exit 1
          fi
          IFS=$'\t' read -r udid platform_version <<< "$selection"
          test -n "$udid" && test -n "$platform_version"
          echo "Selected iPhone SE 3 on iOS $platform_version ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "platform_version=$platform_version" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
      - name: Start Appium and simulator video
        shell: bash
        run: |
          mkdir -p test-results/ios-safari
          appium --base-path / --log test-results/ios-safari/appium.log > /dev/null 2>&1 &
          echo $! > test-results/ios-safari/appium.pid
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" recordVideo --codec=h264 --force test-results/ios-safari/ios-safari.mp4 > test-results/ios-safari/video.log 2>&1 &
          echo $! > test-results/ios-safari/video.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise Mobile Safari through Appium
        env:
          IOS_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          IOS_SIMULATOR_PLATFORM_VERSION: ${{ steps.simulator.outputs.platform_version }}
          # A cold WebDriverAgent build is minutes, not the driver's default 60s.
          CINDERLINE_IOS_DERIVED_DATA: ${{ github.workspace }}/test-results/wda-derived-data
        run: npm run test:ios-safari
      - name: Stop recording
        if: always()
        shell: bash
        run: |
          if test -f test-results/ios-safari/video.pid; then kill -INT "$(cat test-results/ios-safari/video.pid)" 2>/dev/null || true; fi
          if test -f test-results/ios-safari/appium.pid; then kill "$(cat test-results/ios-safari/appium.pid)" 2>/dev/null || true; fi
          sleep 2
      - name: Preserve Safari screenshots, video, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-se3-mobile-safari-${{ github.sha }}
          path: test-results/ios-safari
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: [build, ios-safari]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # F6 — a deployment job reporting success is not evidence that the public
  # surface serves what we built. This fetches what a real visitor receives and
  # compares it byte for byte against the build of this commit. If it does not
  # match, the delivery fails loudly instead of being recorded as verified.
  verify:
    name: F6 public revision
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rebuild this commit to compare against
        run: npm run build
      - name: Wait for the deployment to propagate
        run: sleep 45
      - name: Verify the real public surface
        env:
          F6_PUBLIC_URL: ${{ needs.deploy.outputs.page_url || 'https://bachikoljunior-blip.github.io/survival/' }}
          F6_EXPECT_SHA: ${{ github.sha }}
        run: node tools/gates/f6_public_revision.mjs
      - name: Say what to do when this fails
        if: failure()
        run: |
          echo "::error::The public surface is not serving ${{ github.sha }}."
          echo "Do not record this delivery as verified."
          echo "Revert with: gh workflow run revert-to-verified.yml -f revision=<last verified sha>"
          echo "The last verified revision is recorded in AI_DEVELOPMENT/STATE.yaml."
