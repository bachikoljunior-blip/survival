name: Autopilot

run-name: Autopilot (chain ${{ inputs.chain }})

# 自己再起動式のオートパイロット。
#
# **1回の実行 = 担当者1体 = 1ラウンド。**
#
# ラウンドの実体は `AI_DEVELOPMENT/SESSION_STATE.json` の `active_frontier` である。
# 担当者はそれを空にするまで作業し、次のラウンドの中身を決めてから終わる。1回で
# 終わらなくてもよい——時間切れは異常ではなく、次の実行が同じラウンドを途中から
# 引き継ぐ。frontier に「作業中」の項目が残っているのはその通常の姿である。
#
# schedule は**意図的に置いていない**——連鎖と併用すると多重起動する。
#
# 時間の設計:
#   - 担当者に 240 分、ジョブ全体に 300 分。差の 60 分が PR・マージ待ち・連鎖の取り分。
#   - 担当者が時間切れになっても PR・マージ・連鎖は動く（`!cancelled()`）。
#     **ここを `success()` にしてはならない。** 打ち切り1回で、その回の成果と
#     残りの連鎖を同時に失う。時間制限をジョブ側だけに置くのも同じ理由で不可。
#     ジョブが時間切れになると後続ステップは動かないため、担当者側に先に当たる
#     制限を置いて、打ち切りを「その回だけの損」に閉じ込めている。
#
# 停止条件は4つ（いずれか1つで連鎖が止まる）:
#   - 成果が既定ブランチにマージされなかった … 進まない連鎖は回さない
#   - docs/STOP が存在する                    … 人間が手で止めるための緊急ブレーキ
#   - docs/STATE.md に ALL_DONE               … 作業が完了した
#   - chain が 20 以上                        … 暴走に対する上限
on:
  workflow_dispatch:
    inputs:
      chain:
        description: '連鎖回数。手動起動なら 1 のままでよい'
        required: false
        default: '1'
        type: string

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      BRANCH: autopilot/run-${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------ Round
      - name: Round
        timeout-minutes: 240
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはオートパイロットである。**この実行は1ラウンドを担当する。**

            ## 読む順序
            1. `PROJECT_OPERATING_PROTOCOL.md`
            2. `AI_DEVELOPMENT/INDEX.md`
            3. `docs/directive.md` — 製品規則の正本。全ての規則はここにある
            4. `docs/STATE.md` — 人間向け進捗の正本
            5. `AI_DEVELOPMENT/PROJECT_STATE.json` と `AI_DEVELOPMENT/SESSION_STATE.json`

            ## ラウンドとは何か
            **このラウンドの範囲は `SESSION_STATE.json` の `active_frontier` である。**
            これが機械側の正本であり、あなたが空にすべき集合である。

            `docs/STATE.md` §3 の「次の3アクション」は directive §19 が要求する
            **人間向けの表示**であって、作業量の上限ではない。frontier が3件より
            多いなら、STATE.md には次の3件を表示しつつ、**作業は frontier 全体に
            対して行う**。表示と frontier が食い違って見えても、揃えるために
            どちらかを削ってはならない。§19 は両者を別物として要求している。

            frontier に「作業中」の項目があるのは正常である。前の実行が時間切れで
            中断しただけなので、その続きから始めてよい。

            ## この実行でやること
            1. `active_frontier` の項目を、全て検証済みになるまで進める
            2. 空にできたら、**次のラウンドの `active_frontier` を決める。**
               これがこの実行の最後の仕事である
            3. `active_frontier` が最初から空だった場合、次のラウンドの中身を
               決めることが**このラウンドの作業そのもの**である。実装には入るな。
               Gate B が終わっているなら `docs/directive.md` §16 の Gate C を
               具体的な task に割り、stable ID を付けて `PROJECT_STATE.json` に
               登録する。割るところまでで止まる

            ## 手数と範囲
            手数の上限は無い。**ラウンドが範囲である。** frontier の外へ手を
            広げてはならない。作業中に frontier 外の問題を見つけたら、その場で
            直さず task として登録し、次以降のラウンドに回す。

            ## 部下を使ってよい
            作業を分割して複数のエージェントに並行させてよい。ただし:
            - `docs/STATE.md` §6 の所有権マップに従い、**同一ファイルを2体に
              同時に編集させない**
            - §14 のとおり、**機能を作ったエージェントが、その機能を承認する
              唯一のエージェントであってはならない**
            - 批評エージェントの入力は成果物・実ビルド・`docs/DONE.md` のみ。
              実装エージェントの報告や要約、`README.md` を入力にしてはならない

            ## 時間の扱い — ここが最重要
            **あなたは約4時間で予告なく打ち切られる。** 打ち切られた時点で
            書かれていないものは全て失われる。

            したがって**最後にまとめて記録してはならない。** 作業が1単位終わり、
            ビルドとテストが通るたびに、その場で:
            - コミットする
            - `docs/STATE.md` を更新する
              （現在フェーズ／完了分／次の3アクション／ブロッカー／決定変更）
            - `PROJECT_STATE.json` と `SESSION_STATE.json` を更新し、
              `state_revision` を同期する

            **次の実行は、記憶を持たない別のエージェントがこれらのファイルだけを
            読んで再開する。** いつ止められても再開できる状態を常に保つこと。
            ここを後回しにすると、打ち切られた瞬間にこの実行が丸ごと無駄になる。

            ## 規則
            - ブランチ `autopilot/run-${{ github.run_number }}` を作成
              （既にあれば継続）してコミットする
            - **ビルドとテストが通る状態でのみコミットする**
            - `README.md` を設計の根拠にしない。実装者の自己申告文書である
            - **アセット・テスト・計測・スクリーンショット・完了主張を捏造しない**
            - **`.github/workflows/autopilot.yml` を変更してはならない**

            ## ALL_DONE について
            `docs/STATE.md` に `ALL_DONE` と書いてよいのは、`docs/DONE.md` の
            「`ALL_DONE` の条件」4項目を**全て**満たした時のみである。
            満たしていないのに書くことは、directive §15 の捏造禁止に対する違反として扱う。
            自信が無ければ書くな。

      # --------------------------------------------------------------------- PR
      #
      # 担当者が時間切れで打ち切られていても、そこまでのコミットは枝に積まれている。
      # `success()` にすると、それを取り込む機会ごと失う。
      - name: Open pull request
        id: pr
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "ブランチ $BRANCH が存在しない（コミットが1つも積まれなかった）。PR は作らない。"
            exit 0
          fi

          num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$num" ] && [ "$num" != "null" ]; then
            echo "既に PR #$num が開いている。作成はしない。"
          else
            if gh pr create --fill --base "${{ github.event.repository.default_branch }}" --head "$BRANCH"; then
              num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
              echo "PR #$num を作成した。"
            else
              echo "PR を作成しなかった（ベースとの差分が無い可能性）。ワークフローは失敗させない。"
              num=""
            fi
          fi

          [ "$num" = "null" ] && num=""
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ Merge
      #
      # 連鎖の前にマージしなければならない。
      #
      # 次の実行は `gh workflow run` が既定ブランチ基準で走るため、**既定ブランチを
      # チェックアウトする**。この実行の成果が PR に留まったままだと、次の実行は
      # 更新前の docs/STATE.md と SESSION_STATE.json を読み、まったく同じラウンドを
      # 最初からやり直す。作業が一切積み上がらないまま chain 上限まで回ることになる。
      #
      # マージには AUTOPILOT_PAT を使う。GITHUB_TOKEN による push は他のワークフローを
      # 起動しないため、Pages のデプロイが走らなくなる。
      - name: Merge pull request
        id: merge
        if: ${{ !cancelled() && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail

          # --auto はブランチ保護があるリポジトリで、直接マージは auto-merge が
          # 無効なリポジトリで通る。両方試して、どちらかが通ればよい。
          gh pr merge "$PR" --squash --auto --delete-branch \
            || gh pr merge "$PR" --squash --delete-branch \
            || echo "マージ要求は通らなかった。状態をポーリングして確認する。"

          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            st=$(gh pr view "$PR" --json state --jq .state 2>/dev/null || echo '')
            case "$st" in
              MERGED)
                echo "merged=true" >> "$GITHUB_OUTPUT"
                echo "PR #$PR をマージした。次の実行は最新の既定ブランチから始まる。"
                exit 0 ;;
              CLOSED)
                echo "PR #$PR は閉じられた。マージしていない。"
                exit 0 ;;
            esac
            sleep 15
          done

          echo "10分待っても PR #$PR がマージされなかった（必須チェック待ち、"
          echo "コンフリクト、レビュー必須などの可能性）。連鎖はしない。"

      # ------------------------------------------------------------------ Chain
      - name: Chain next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          CHAIN: ${{ inputs.chain }}
          MERGED: ${{ steps.merge.outputs.merged }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          # --- 停止条件 0: マージが成立していない ---
          #
          # 次の実行は既定ブランチをチェックアウトする。マージされていなければ
          # 次の実行が読む docs/STATE.md と SESSION_STATE.json はこの実行より
          # 前のもので、まったく同じラウンドを最初からやり直すだけになる。
          # **進まない連鎖は回さない。**
          if [ "${MERGED:-}" != "true" ]; then
            echo "停止: この実行の成果が既定ブランチにマージされていない。"
            echo "      連鎖しても次の実行は同じ状態を読み、同じ作業を繰り返す。"
            echo "      PR を確認してマージし、必要なら手動で再開すること。"
            exit 0
          fi

          # 停止条件は「次の実行が実際に読むもの」に対して判定する。
          # 次の実行は既定ブランチをチェックアウトするので、そこを見る。
          git fetch origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
          REF="origin/$DEFAULT_BRANCH"
          git rev-parse --verify "$REF" >/dev/null 2>&1 || REF="HEAD"
          echo "判定対象: $REF"

          # --- 停止条件 1: 緊急ブレーキ ---
          if git cat-file -e "$REF:docs/STOP" 2>/dev/null; then
            echo "停止: docs/STOP が存在する。連鎖を終了する。"
            exit 0
          fi

          # --- 停止条件 2: 完了 ---
          if git show "$REF:docs/STATE.md" 2>/dev/null | grep -q 'ALL_DONE'; then
            echo "停止: docs/STATE.md に ALL_DONE がある。連鎖を終了する。"
            exit 0
          fi

          # --- 停止条件 3: 暴走上限 ---
          chain="${CHAIN:-1}"
          if ! printf '%s' "$chain" | grep -Eq '^[0-9]+$'; then
            echo "停止: chain の値 '$chain' が数値でない。連鎖を終了する。"
            exit 0
          fi
          if [ "$chain" -ge 20 ]; then
            echo "停止: chain=$chain が上限 20 に達した。連鎖を終了する。"
            exit 0
          fi

          next=$((chain + 1))
          echo "継続: chain=$chain → $next。60秒待って次を起動する。"
          sleep 60
          gh workflow run autopilot.yml -f chain="$next"
          echo "chain=$next を起動した。"
