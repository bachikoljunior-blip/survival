# Floor enforcement gates (protocol v2.2, Section 0 F9).
#
# These exist because a run that skipped a floor obligation and reported it as
# satisfied is otherwise indistinguishable from a run that performed it. A rule
# in a document cannot fail. These can.
#
# Each job is a thin wrapper: the logic lives in tools/gates/ so it can be run
# locally and, more importantly, so it can be observed failing on a deliberately
# bad input. A gate never seen to fail is recorded as prepared_not_executed.
#
# To make these binding rather than advisory, add them to the ruleset for `main`
# as required status checks. The job names below are exactly the strings to type
# into "Add checks", and they are deliberately plain ASCII so they can be typed
# on a phone. Until that is done they run and report but do not block, and
# AI_DEVELOPMENT/STATE.yaml must say so.
name: Floor gates

on:
  pull_request:
    branches: [main]
    # `edited` matters: the F5 check reads the pull-request body, and without it
    # a corrected review trailer would never re-run the check that reads it,
    # leaving a red gate that no longer reflects reality.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f2-state-update:
    name: F2 state update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Product files changed without a state update?
        env:
          F2_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
        run: node tools/gates/f2_state_update.mjs --base "$F2_BASE"

  f3-core:
    name: F3 core and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the save gate asks git what the revision its fixture was
      # captured from actually shipped, rather than trusting the fixture's own
      # note about itself. A shallow clone cannot answer, and the gate fails
      # rather than skipping — so give it the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install the browsers the surface checks need
        run: npx playwright install --with-deps chromium webkit
      - name: Build, validate and drive the real build
        run: node tools/gates/f3_execution.mjs
      - name: Exercise the iPhone SE 3 WebKit surface
        env:
          CINDERLINE_REQUIRE_BASELINE: "1"
        run: npm run test:iphone-webkit
      - name: Preserve WebKit screenshots, video, trace and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-se3-webkit-${{ github.sha }}
          path: test-results/iphone-webkit
          if-no-files-found: warn
          retention-days: 14

  # Pages is also configured to publish from the main branch. Running this
  # before merge ensures that publication can never get ahead of Mobile Safari
  # verification, even when GitHub's built-in branch-source deploy starts as
  # soon as main advances.
  ios-safari:
    name: iPhone SE 3 Mobile Safari
    needs: f3-core
    runs-on: macos-15
    timeout-minutes: 50
    env:
      # The runner's default is Xcode 16.4, while its newest SE 3 simulator is
      # iOS 26.2. Pin the matching toolchain instead of silently mixing them.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore exact dependencies and build
        run: |
          npm ci
          npm run validate:ops
          npm run validate
          npm run build
          npm run validate:pages-root
      - name: Install pinned Appium and XCUITest driver
        run: |
          npm install --global appium@3.6.0
          appium driver install xcuitest@12.1.3
          appium driver list --installed
      - name: Select and boot the matching iPhone SE 3 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | awk '/^Xcode / { print $2 }')" = "26.2"
          expected_runtime="com.apple.CoreSimulator.SimRuntime.iOS-26-2"
          selection="$(xcrun simctl list devices available --json | jq -r --arg runtime "$expected_runtime" '
            [.devices | to_entries[] | select(.key == $runtime) | .value[] |
             select(.name == "iPhone SE (3rd generation)" and .isAvailable == true) |
             {udid: .udid, runtime: $runtime}] |
            first | [.udid, .runtime] | @tsv')"
          if test -z "$selection" || test "$selection" = "null"; then
            xcrun simctl list devices available
            echo "::error::iPhone SE (3rd generation) on iOS 26.2 is unavailable for Xcode 26.2."
            exit 1
          fi
          IFS=$'\t' read -r udid runtime <<< "$selection"
          if test -z "$udid" || test -z "$runtime"; then
            echo "::error::Simulator selection did not return both a UDID and runtime."
            exit 1
          fi
          platform_version="$(printf '%s' "$runtime" | sed -E 's/^.*\.iOS-//; s/-/./g')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "platform_version=$platform_version" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
      - name: Start Appium and simulator video
        shell: bash
        run: |
          mkdir -p test-results/ios-safari
          appium --base-path / --log test-results/ios-safari/appium.log > /dev/null 2>&1 &
          echo $! > test-results/ios-safari/appium.pid
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" recordVideo --codec=h264 --force test-results/ios-safari/ios-safari.mp4 > test-results/ios-safari/video.log 2>&1 &
          echo $! > test-results/ios-safari/video.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise Mobile Safari through Appium
        env:
          IOS_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          IOS_SIMULATOR_PLATFORM_VERSION: ${{ steps.simulator.outputs.platform_version }}
        run: npm run test:ios-safari
      - name: Stop recording
        if: always()
        shell: bash
        run: |
          if test -f test-results/ios-safari/video.pid; then kill -INT "$(cat test-results/ios-safari/video.pid)" 2>/dev/null || true; fi
          if test -f test-results/ios-safari/appium.pid; then kill "$(cat test-results/ios-safari/appium.pid)" 2>/dev/null || true; fi
          sleep 2
      - name: Preserve Safari screenshots, video, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-se3-mobile-safari-${{ github.sha }}
          path: test-results/ios-safari
          if-no-files-found: warn
          retention-days: 14

  # Branch protection already requires this exact check name. The aggregate is
  # deliberately `always()` so a skipped Safari dependency cannot look green.
  f3-execution:
    name: F3 execution
    if: always()
    needs: [f3-core, ios-safari]
    runs-on: ubuntu-latest
    steps:
      - name: Require both browser layers
        env:
          CORE_RESULT: ${{ needs.f3-core.result }}
          IOS_RESULT: ${{ needs.ios-safari.result }}
        run: |
          echo "Core/WebKit: $CORE_RESULT"
          echo "Mobile Safari: $IOS_RESULT"
          test "$CORE_RESULT" = "success"
          test "$IOS_RESULT" = "success"

  f5-review-record:
    name: F5 review record
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Review trailer present and consistent with STATE.yaml?
        env:
          F5_REVIEW_BODY: ${{ github.event.pull_request.body }}
        run: node tools/gates/f5_review_record.mjs
