# Execute the existing Mobile Safari alternative on the user's development branch.
# Standard public-repository runner only; no publishing, external AI or secrets.
name: Mobile Safari simulator

on:
  push:
    branches: [claude/repo-instructions-constraints-r0070m]
    paths:
      - 'src/**'
      - 'tools/test-ios-safari.mjs'
      - 'tools/ios_audio_capture.mjs'
      - 'tools/mobile_audio_capture.mjs'
      - 'tools/select-ios-simulator.mjs'
      - 'tools/webdriver-request.mjs'
      - 'tools/ios-pointer-coordinates.mjs'
      - '.github/workflows/mobile-simulator.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
  workflow_dispatch:
    inputs:
      capture_audio:
        description: 'Measure pinned production audio/canvas recording capabilities and capture three actual scenes once'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-safari:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Explicit single-attempt acquisition; ordinary mobile and Pages gates
      # retain their existing behavior. No comparison status is awarded here.
      CINDERLINE_IOS_AUDIO_CAPTURE: ${{ github.run_attempt == 1 && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[ios-audio-c28-r1]')) || (github.event_name == 'workflow_dispatch' && inputs.capture_audio)) && '1' || '0' }}
    steps:
      - name: Check out the exact requested branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore exact dependencies and rebuild
        run: |
          npm ci
          npm run validate:ops
          npm run validate
          npm run build
          npm run validate:pages-root
      - name: Preserve actual simulator environment
        run: |
          mkdir -p test-results/ios-safari
          xcodebuild -version > test-results/ios-safari/xcode-version.txt
          xcrun simctl list --json > test-results/ios-safari/simulator-inventory.json
      - name: Install pinned Appium and XCUITest driver
        run: |
          npm install --global appium@3.6.0
          appium driver install xcuitest@12.1.3
          appium driver list --installed
      - name: Select and boot iPhone SE 3 simulator
        id: simulator
        shell: bash
        run: |
          mkdir -p test-results/ios-safari
          xcode-select -p > test-results/ios-safari/xcode-path.txt
          xcodebuild -version > test-results/ios-safari/xcode-version.txt
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf '%s\n' "$sdk_version" > test-results/ios-safari/simulator-sdk-version.txt
          xcrun simctl list --json > test-results/ios-safari/simulator-inventory.json
          selection="$(node tools/select-ios-simulator.mjs "$sdk_version" test-results/ios-safari/simulator-inventory.json test-results/ios-safari/simulator-selection.json)"
          IFS=$'\t' read -r udid platform_version <<< "$selection"
          test -n "$udid" && test -n "$platform_version"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "platform_version=$platform_version" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
      - name: Start Appium and simulator video
        shell: bash
        run: |
          mkdir -p test-results/ios-safari
          appium_log_args=()
          if test "$CINDERLINE_IOS_AUDIO_CAPTURE" = '1'; then appium_log_args=(--log-level info); fi
          appium --base-path / --log test-results/ios-safari/appium.log "${appium_log_args[@]}" > /dev/null 2>&1 &
          echo $! > test-results/ios-safari/appium.pid
          # In the opt-in attempt the shared recorder captures real canvas
          # video with production sound; avoid a duplicate silent video load.
          if test "$CINDERLINE_IOS_AUDIO_CAPTURE" != '1'; then
            xcrun simctl io "${{ steps.simulator.outputs.udid }}" recordVideo --codec=h264 --force test-results/ios-safari/ios-safari.mp4 > test-results/ios-safari/video.log 2>&1 &
            echo $! > test-results/ios-safari/video.pid
          fi
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4723/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise Mobile Safari through Appium
        env:
          IOS_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          IOS_SIMULATOR_PLATFORM_VERSION: ${{ steps.simulator.outputs.platform_version }}
        run: npm run test:ios-safari
      - name: Stop recording
        if: always()
        shell: bash
        run: |
          if test -f test-results/ios-safari/video.pid; then kill -INT "$(cat test-results/ios-safari/video.pid)" 2>/dev/null || true; fi
          if test -f test-results/ios-safari/appium.pid; then kill "$(cat test-results/ios-safari/appium.pid)" 2>/dev/null || true; fi
          sleep 2
      - name: Emit startup diagnostics in ordinary CI log
        if: ${{ always() && env.CINDERLINE_IOS_AUDIO_CAPTURE != '1' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          // Proposed CI-only observation step; not installed in the repository.
          // Run after the existing Stop recording step. No browser/device/network calls.
          import { readFileSync, statSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const files = [
            ['appium.log', 4 * 1024 * 1024],
            ['simulator-selection.json', 64 * 1024],
            ['xcode-version.txt', 64 * 1024],
            ['xcode-path.txt', 64 * 1024],
            ['simulator-sdk-version.txt', 64 * 1024],
          ];
          for (const [file, cap] of files) {
            try {
              const path = `test-results/ios-safari/${file}`;
              const before = statSync(path);
              const data = readFileSync(path);
              const after = statSync(path);
              const complete = data.length <= cap;
              const ranges = complete ? [[0, data.length]] : [[0, cap / 2], [data.length - cap / 2, data.length]];
              const sha256 = createHash('sha256').update(data).digest('hex');
              const stableDuringRead = before.size === after.size && before.mtimeMs === after.mtimeMs && after.size === data.length;
              console.log('[ios-startup-log-meta] ' + JSON.stringify({ file, capturedAt: new Date().toISOString(), bytes: data.length, sha256, complete, stableDuringRead, cap, ranges }));
              for (const [start, end] of ranges) {
                for (let offset = start; offset < end; offset += 3000) {
                  const bytes = data.subarray(offset, Math.min(end, offset + 3000));
                  console.log('[ios-startup-log-chunk] ' + JSON.stringify({ file, offset, base64: bytes.toString('base64') }));
                }
              }
              console.log('[ios-startup-log-end] ' + JSON.stringify({ file, bytes: data.length, sha256, complete }));
            } catch (error) {
              console.log('[ios-startup-log-error] ' + JSON.stringify({ file, code: error.code || null, message: error.message }));
            }
          }
          // Let the normal process exit drain stdout. This step cannot change the failed
          // test step's outcome. Complete refers to the captured file snapshot only.

          NODE
      - name: Preserve Safari screenshots, video, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-se3-mobile-safari-${{ github.sha }}
          path: test-results/ios-safari
          if-no-files-found: warn
          retention-days: 14
